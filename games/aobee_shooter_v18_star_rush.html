<script defer src="../assets/character-identity.js?v=2"></script></head><body><div id="wrap"><canvas id="g" width="420" height="760"></canvas><div id="pad"></div></div><div id="debugStage" style="display:none;position:fixed;inset:0;background:#06152df2;z-index:10;color:white;font-family:system-ui,sans-serif;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="font-size:24px;font-weight:900;color:#ffe45c">SECRET STAGE SELECT</div><div style="font-size:13px;color:#9bdcff">ド下手ゲーマーモード ポコ</div><div style="display:flex;gap:8px;margin-top:8px"><button id="godBtn" style="padding:9px 12px;border-radius:12px;border:1px solid #65f4ff;background:#0c4960;color:white;font-weight:900">無敵：ON</button><button id="fullBtn" style="padding:9px 12px;border-radius:12px;border:1px solid #ffe45c;background:#5a4810;color:white;font-weight:900">FULL POWER：ON</button></div><div style="font-size:12px;color:#fff9;margin-top:2px">ステージを選ぶと、この設定で即スタート</div><div id="stageBtns" style="display:grid;grid-template-columns:repeat(5,52px);gap:8px;margin-top:10px"></div><button id="debugClose" style="margin-top:10px;padding:10px 24px;border-radius:12px;border:1px solid #65d8ff;background:#102c54;color:white;font-weight:800">閉じる</button></div><div id="bgmHiddenUI" style="display:none"><span id="master-icon"></span><span id="master-text"></span><span id="vol-display"></span><input id="master-volume"><span id="track-stage-label"></span><span id="track-title"></span><span id="track-genre"></span><span id="track-desc"></span><span id="track-bpm"></span><span id="track-bar"></span><span id="track-section"></span><span id="audio-context-status"></span><canvas id="visualizer-canvas"></canvas><div id="card-stage1"></div><div id="card-stage2"></div><div id="card-stage3"></div><div id="card-stage4"></div><div id="card-stage5"></div><div id="card-stage6"></div></div><script>
// Master Audio Context
let bgmCtx = null;
let masterGain = null;
let analyser = null;

// Global State
let currentStage = 1;
let isPlaying = false;
let masterVolumeValue = 0.28;
let timerId = null;

// Sequencer Tracking
let currentTick = 0; // 16th notes
let currentBar = 0;
let totalBars = 32;

// Synth Data & Track Config
const STAGE_CONFIGS = {
    1: { name: '青空 (Blue Sky)', genre: 'J-RPG / Action Pop', bpm: 138, bars: 32, desc: '跳ねるベース、明快なメジャーコード、シンセベルのメロディ。爽快な冒険の始まりを象徴。' },
    2: { name: '夕焼け (Sunset Flight)', genre: '高速ロック / レース風', bpm: 156, bars: 32, desc: 'ディストーションギター風シンセと駆け抜ける8ビート。切なく激しい空中戦。' },
    3: { name: '雷雲 (Thundercloud)', genre: 'インダストリアル / テクノ', bpm: 132, bars: 32, desc: '重低音キックと不協和音リフ、雷ノイズFMが鳴り響く不気味なダークテクノ。' },
    4: { name: '星空・宇宙 (Starlight Cosmos)', genre: 'スペース・アンビエント / トランス', bpm: 144, bars: 32, desc: '広大な宇宙を浮游する長尺コードからトランスビートへと展開する最も美しい曲。' },
    5: { name: 'わるびー要塞 (Fortress Walbee)', genre: 'メカニカル・ドラムンベース', bpm: 172, bars: 32, desc: '高速ブレイクビーツ、警告音シンセ、アグレッシブなFMベースが緊迫感を煽る。' },
    6: { name: 'ダークコア (Dark Core)', genre: 'シンフォニック・メタル', bpm: 165, bars: 36, desc: 'ボス出現重低音ライザーから爆発的ツーバス＆オケブラスで展開する最終決戦。' }
};

// Initialize Audio Context Safely
function initBgmAudio() {
    if (!bgmCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        bgmCtx = new AudioContextClass();
        
        analyser = bgmCtx.createAnalyser();
        analyser.fftSize = 256;

        masterGain = bgmCtx.createGain();
        masterGain.gain.setValueAtTime(masterVolumeValue, bgmCtx.currentTime);
        
        masterGain.connect(analyser);
        analyser.connect(bgmCtx.destination);
    }
    if (bgmCtx.state === 'suspended') {
        bgmCtx.resume();
    }
}

// Global UI & Control API
function setBGMVolume(val) {
    masterVolumeValue = Math.max(0, Math.min(1, parseFloat(val)));
    if (masterGain && bgmCtx) {
        masterGain.gain.setValueAtTime(masterVolumeValue, bgmCtx.currentTime);
    }
    document.getElementById('vol-display').innerText = Math.round(masterVolumeValue * 100) + '%';
    document.getElementById('master-volume').value = masterVolumeValue;
}

function handleVolumeChange(val) {
    setBGMVolume(val);
}

function togglePlayMaster() {
    if (isPlaying) {
        stopBGM();
    } else {
        playStageBGM(currentStage);
    }
}

function stopBGM() {
    isPlaying = false;
    if (timerId) clearInterval(timerId);
    timerId = null;
    
    document.getElementById('master-icon').className = 'fa-solid fa-play';
    document.getElementById('master-text').innerText = 'START BGM';
}

function updateCardHighlight(stageNum) {
    for (let i = 1; i <= 6; i++) {
        const card = document.getElementById(`card-stage${i}`);
        if (card) {
            if (i === stageNum) {
                card.classList.add('active-card');
            } else {
                card.classList.remove('active-card');
            }
        }
    }
    const conf = STAGE_CONFIGS[stageNum];
    if (conf) {
        document.getElementById('track-stage-label').innerText = stageNum === 6 ? 'NOW PLAYING: FINAL BOSS' : `NOW PLAYING: STAGE ${stageNum}`;
        document.getElementById('track-title').innerText = conf.name;
        document.getElementById('track-genre').innerText = `${conf.genre} (BPM ${conf.bpm})`;
        document.getElementById('track-desc').innerText = conf.desc;
        document.getElementById('track-bpm').innerText = conf.bpm;
        totalBars = conf.bars;
    }
}


// Note Name to Frequency Conversion
function noteFreq(noteStr) {
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const regex = /^([A-G]#?)(-?\d+)$/;
    const match = noteStr.match(regex);
    if (!match) return 0;
    const note = match[1];
    const octave = parseInt(match[2], 10);
    const semitone = notes.indexOf(note);
    return 440 * Math.pow(2, (octave - 4) + (semitone - 9) / 12);
}


// Stage 1 Kick
function playPopKick(t) {
    const osc = bgmCtx.createOscillator();
    const gain = bgmCtx.createGain();
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.08);
    gain.gain.setValueAtTime(1.0, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.12);
}

// Stage 1 Snare
function playPopSnare(t) {
    // Noise
    const bufferSize = bgmCtx.sampleRate * 0.1;
    const buffer = bgmCtx.createBuffer(1, bufferSize, bgmCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = bgmCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = bgmCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1000;
    
    const gain = bgmCtx.createGain();
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    noise.start(t);
}

// Stage 1 Hi-Hat
function playHiHat(t, open = false) {
    const bufferSize = bgmCtx.sampleRate * (open ? 0.15 : 0.03);
    const buffer = bgmCtx.createBuffer(1, bufferSize, bgmCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = bgmCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = bgmCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 7000;
    
    const gain = bgmCtx.createGain();
    gain.gain.setValueAtTime(open ? 0.3 : 0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.15 : 0.03));
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    noise.start(t);
}

// Synth Lead (Bell/Pop)
function playPopSynth(freq, t, dur = 0.15) {
    if (!freq) return;
    const osc = bgmCtx.createOscillator();
    const osc2 = bgmCtx.createOscillator();
    const gain = bgmCtx.createGain();
    
    osc.type = 'sine';
    osc2.type = 'triangle';
    
    osc.frequency.setValueAtTime(freq, t);
    osc2.frequency.setValueAtTime(freq * 2, t); // Octave higher for bell sheen
    
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    
    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(masterGain);
    
    osc.start(t);
    osc2.start(t);
    osc.stop(t + dur);
    osc2.stop(t + dur);
}

// Bass Synth
function playBass(freq, t, dur = 0.2, type = 'sawtooth') {
    if (!freq) return;
    const osc = bgmCtx.createOscillator();
    const filter = bgmCtx.createBiquadFilter();
    const gain = bgmCtx.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, t);
    filter.frequency.exponentialRampToValueAtTime(150, t + dur);
    
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    
    osc.start(t);
    osc.stop(t + dur);
}

// Stage 2 Distortion Guitar Generator
function playDistortionGuitar(freq, t, dur = 0.2) {
    if (!freq) return;
    const osc = bgmCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);

    // Distortion WaveShaper
    const waveshaper = bgmCtx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
        let x = (i * 2) / 256 - 1;
        curve[i] = (3 + 20) * x * 20 * (Math.PI / 180) / (Math.PI + 20 * Math.abs(x));
    }
    waveshaper.curve = curve;

    const filter = bgmCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2500, t);

    const gain = bgmCtx.createGain();
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

    osc.connect(waveshaper);
    waveshaper.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    osc.start(t);
    osc.stop(t + dur);
}

// Stage 3 Industrial Heavy Kick & Thunder
function playIndustrialKick(t) {
    const osc = bgmCtx.createOscillator();
    const gain = bgmCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(25, t + 0.2);
    
    gain.gain.setValueAtTime(0.8, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.25);
}

function playThunderEffect(t) {
    const bufferSize = bgmCtx.sampleRate * 0.4;
    const buffer = bgmCtx.createBuffer(1, bufferSize, bgmCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = bgmCtx.createBufferSource();
    noise.buffer = buffer;
    
    const filter = bgmCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(400, t);
    filter.Q.value = 1.0;
    
    const gain = bgmCtx.createGain();
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    noise.start(t);
}

// Stage 4 Ambient Pad Chord
function playSpacePad(freqs, t, dur = 1.2) {
    freqs.forEach(freq => {
        const osc = bgmCtx.createOscillator();
        const gain = bgmCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        
        gain.gain.setValueAtTime(0.01, t);
        gain.gain.linearRampToValueAtTime(0.1, t + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        
        osc.connect(gain);
        gain.connect(masterGain);
        
        osc.start(t);
        osc.stop(t + dur);
    });
}

// Stage 5 Drum & Bass Amen-style Snare
function playDnBSnare(t) {
    const osc = bgmCtx.createOscillator();
    const oscGain = bgmCtx.createGain();
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.08);
    oscGain.gain.setValueAtTime(0.5, t);
    oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
    osc.connect(oscGain);
    oscGain.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.08);

    playHiHat(t, false);
}

// Final Boss Brass Chord & Riser
function playOrchestralBrass(freqs, t, dur = 0.5) {
    freqs.forEach(freq => {
        const osc = bgmCtx.createOscillator();
        const osc2 = bgmCtx.createOscillator();
        const gain = bgmCtx.createGain();
        
        osc.type = 'sawtooth';
        osc2.type = 'square';
        osc.frequency.setValueAtTime(freq, t);
        osc2.frequency.setValueAtTime(freq * 1.005, t); // Detuned brass unison
        
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(masterGain);
        
        osc.start(t);
        osc2.start(t);
        osc.stop(t + dur);
        osc2.stop(t + dur);
    });
}

function playBossRiser(t) {
    const osc = bgmCtx.createOscillator();
    const gain = bgmCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(50, t);
    osc.frequency.exponentialRampToValueAtTime(800, t + 1.2);
    
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 1.2);
    
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t);
    osc.stop(t + 1.2);
}


function playStageBGM(stageNum) {
    initBgmAudio();
    stopBGM();

    currentStage = stageNum;
    updateCardHighlight(stageNum);
    isPlaying = true;
    currentTick = 0;
    currentBar = 0;

    document.getElementById('master-icon').className = 'fa-solid fa-square';
    document.getElementById('master-text').innerText = 'STOP BGM';

    const bpm = STAGE_CONFIGS[stageNum].bpm;
    const intervalMs = (60 / bpm / 4) * 1000; // 16th note timing

    timerId = setInterval(() => {
        if (!isPlaying || shooterPaused) return;
        const now = bgmCtx.currentTime;

        // Run Specific Stage Sequencer logic
        switch (currentStage) {
            case 1: sequenceStage1(currentTick, now); break;
            case 2: sequenceStage2(currentTick, now); break;
            case 3: sequenceStage3(currentTick, now); break;
            case 4: sequenceStage4(currentTick, now); break;
            case 5: sequenceStage5(currentTick, now); break;
            case 6: sequenceStage6(currentTick, now); break;
        }

        // Advance Sequence
        currentTick++;
        if (currentTick % 16 === 0) {
            currentBar = (currentBar + 1) % STAGE_CONFIGS[currentStage].bars;
        }

        // Update UI
        document.getElementById('track-bar').innerText = `${String(currentBar + 1).padStart(2, '0')} / ${STAGE_CONFIGS[currentStage].bars}`;
        
        // Update Section Name
        let sec = 'A-Melody';
        if (currentBar >= 8 && currentBar < 16) sec = 'B-Melody';
        if (currentBar >= 16 && currentBar < 24) sec = 'Bridge / Dev';
        if (currentBar >= 24) sec = 'Chorus / Climax';
        if (currentStage === 6 && currentBar < 4) sec = 'INTRO RISER';
        document.getElementById('track-section').innerText = sec;

    }, intervalMs);
}

// ──────────────────────────────────────────
// Stage 1: 青空 (J-RPG Pop) Sequencer
// ──────────────────────────────────────────
function sequenceStage1(tick, t) {
    const bar = Math.floor(tick / 16) % 32;
    const step = tick % 16;

    // Drums
    if (step === 0 || step === 10 || (bar >= 24 && step === 6)) playPopKick(t);
    if (step === 4 || step === 12) playPopSnare(t);
    if (step % 2 === 0) playHiHat(t, step === 14);

    // Bass Line (Bouncy Syncopated)
    const bassNotes = ['C3', 'C3', 'G2', 'A2', 'A2', 'F2', 'G2', 'G2'];
    const currentBass = noteFreq(bassNotes[bar % 8]);
    if (step === 0 || step === 3 || step === 6 || step === 10 || step === 13) {
        playBass(currentBass, t, 0.12, 'triangle');
    }

    // Melody Structure (A -> B -> Bridge -> Chorus)
    let melody = null;
    if (bar < 8) { // A-Melody
        const m = ['E5', null, 'G5', 'A5', null, 'G5', 'E5', null, 'D5', null, 'C5', 'D5', 'E5', null, null, null];
        melody = m[step];
    } else if (bar < 16) { // B-Melody
        const m = ['A5', 'A5', null, 'C6', 'B5', 'G5', null, 'E5', 'F5', 'F5', 'E5', 'D5', 'C5', null, 'D5', null];
        melody = m[step];
    } else if (bar < 24) { // Bridge
        const m = ['G5', null, 'G5', null, 'A5', null, 'C6', null, 'D6', null, null, 'C6', 'D6', 'E6', null, null];
        melody = m[step];
    } else { // Chorus
        const m = ['C6', null, 'C6', 'B5', 'A5', null, 'G5', null, 'A5', 'C6', 'D6', null, 'C6', null, null, null];
        melody = m[step];
    }

    if (melody) {
        playPopSynth(noteFreq(melody), t, 0.15);
    }
}

// ──────────────────────────────────────────
// Stage 2: 夕焼け (High-speed Rock) Sequencer
// ──────────────────────────────────────────
function sequenceStage2(tick, t) {
    const bar = Math.floor(tick / 16) % 32;
    const step = tick % 16;

    // Fast 8-beat Rock Drums
    if (step === 0 || step === 8 || step === 14) playPopKick(t);
    if (step === 4 || step === 12) playPopSnare(t);
    if (step % 2 === 0) playHiHat(t, false);

    // Driving Rock Bass
    const rockBassRoots = ['A2', 'F2', 'G2', 'E2'];
    const bFreq = noteFreq(rockBassRoots[bar % 4]);
    if (step % 2 === 0) {
        playBass(bFreq, t, 0.1, 'sawtooth');
    }

    // Distortion Guitar Riff / Lead
    let guitarNote = null;
    if (bar < 16) {
        const riff = ['A4', null, 'C5', 'A4', 'D5', 'A4', 'E5', 'D5', 'A4', null, 'C5', 'A4', 'G4', null, 'A4', null];
        guitarNote = riff[step];
    } else { // High Voltage Solo
        const solo = ['E5', 'E5', 'G5', 'A5', 'C6', 'A5', 'G5', 'E5', 'D5', 'D5', 'E5', 'G5', 'A5', null, null, null];
        guitarNote = solo[step];
    }

    if (guitarNote) {
        playDistortionGuitar(noteFreq(guitarNote), t, 0.18);
    }
}

// ──────────────────────────────────────────
// Stage 3: 雷雲 (Industrial Dark Techno) Sequencer
// ──────────────────────────────────────────
function sequenceStage3(tick, t) {
    const bar = Math.floor(tick / 16) % 32;
    const step = tick % 16;

    // Heavy Distortion Kick (4-on-the-floor)
    if (step % 4 === 0) playIndustrialKick(t);

    // Thunder FX & Metallic Percussion (Polyrhythms)
    if (step === 7 || step === 15) playThunderEffect(t);

    // Dark Metallic Riff (Dissonant Minor 2nd & Trione)
    const darkRiff = ['C2', null, 'C#2', null, 'C2', 'F#2', null, 'C2'];
    if (step % 2 === 0) {
        const freq = noteFreq(darkRiff[(step / 2) % 8]);
        if (freq) playBass(freq, t, 0.15, 'square');
    }
}

// ──────────────────────────────────────────
// Stage 4: 星空・宇宙 (Ambient Trance) Sequencer
// ──────────────────────────────────────────
function sequenceStage4(tick, t) {
    const bar = Math.floor(tick / 16) % 32;
    const step = tick % 16;

    // Build-up Drums: Starts soft, full trance beat after Bar 16
    if (bar >= 16) {
        if (step % 4 === 0) playPopKick(t);
        if (step === 4 || step === 12) playPopSnare(t);
        if (step % 2 === 0) playHiHat(t, step === 14);
    } else {
        if (step === 0 && bar % 2 === 0) playHiHat(t, true);
    }

    // Space Pad Chords (Every 2 bars)
    if (step === 0 && bar % 2 === 0) {
        const chords = [
            ['C4', 'E4', 'G4', 'B4'],
            ['A3', 'C4', 'E4', 'G4'],
            ['F3', 'A3', 'C4', 'E4'],
            ['G3', 'B3', 'D4', 'F4']
        ];
        const currentChord = chords[(bar / 2) % 4].map(n => noteFreq(n));
        playSpacePad(currentChord, t, 2.0);
    }

    // Sparkling Arpeggio
    const arp = ['C5', 'E5', 'G5', 'B5', 'C6', 'B5', 'G5', 'E5'];
    if (step % 2 === 0) {
        const note = arp[(step / 2) % 8];
        playPopSynth(noteFreq(note), t, 0.2);
    }
}

// ──────────────────────────────────────────
// Stage 5: わるびー要塞 (DnB Mechanical) Sequencer
// ──────────────────────────────────────────
function sequenceStage5(tick, t) {
    const bar = Math.floor(tick / 16) % 32;
    const step = tick % 16;

    // Fast Drum & Bass Breakbeat Pattern
    if (step === 0 || step === 10) playPopKick(t);
    if (step === 4 || step === 12) playDnBSnare(t);
    playHiHat(t, step % 4 === 2); // Fast 16th hats

    // Fast Aggressive FM Bass
    const dnbBass = ['F2', 'F2', null, 'F2', 'G#2', null, 'A#2', null];
    if (step % 2 === 0) {
        const bNote = dnbBass[(step / 2) % 8];
        if (bNote) playBass(noteFreq(bNote), t, 0.08, 'sawtooth');
    }

    // Alarm Warning Synth (Bar 16 onwards)
    if (bar >= 16 && (step === 0 || step === 8)) {
        playPopSynth(noteFreq('F6'), t, 0.05);
    }
}

// ──────────────────────────────────────────
// Stage 6: FINAL BOSS (Symphonic Metal) Sequencer
// ──────────────────────────────────────────
function sequenceStage6(tick, t) {
    const bar = Math.floor(tick / 16) % 36;
    const step = tick % 16;

    // INTRO (Bars 0-3): Boss Riser & Impact
    if (bar < 4) {
        if (step === 0 && bar === 0) playBossRiser(t);
        if (step === 0) playIndustrialKick(t);
        return;
    }

    // Main Boss Beats: Fast Double-Kick Drums
    if (step % 2 === 0) playPopKick(t);
    if (step === 4 || step === 12) playPopSnare(t);
    playHiHat(t, false);

    // Orchestral Brass Chords
    if (step === 0 || step === 8) {
        const bossChords = [
            ['D4', 'F4', 'A4'],
            ['A#3', 'D4', 'F4'],
            ['C4', 'E4', 'G4'],
            ['A3', 'C#4', 'E4']
        ];
        const chord = bossChords[(bar - 4) % 4].map(n => noteFreq(n));
        playOrchestralBrass(chord, t, 0.4);
    }

    // Boss Heroic Melody
    const bossMelody = ['D5', 'D5', 'F5', 'G5', 'A5', null, 'A#5', 'A5', 'G5', 'F5', 'E5', 'F5', 'G5', null, null, null];
    if (bossMelody[step]) {
        playDistortionGuitar(noteFreq(bossMelody[step]), t, 0.2);
    }
}


function playFinalBossBGM() {
    playStageBGM(6);
}

function stage5ToFinalBossTransition() {
    initBgmAudio();
    if (!isPlaying) {
        playFinalBossBGM();
        return;
    }

    // Crossfade Volume Transition
    const fadeOutDuration = 1.2;
    masterGain.gain.setValueAtTime(masterVolumeValue, bgmCtx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.001, bgmCtx.currentTime + fadeOutDuration);

    setTimeout(() => {
        playFinalBossBGM();
        masterGain.gain.setValueAtTime(0.001, bgmCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(masterVolumeValue, bgmCtx.currentTime + 0.5);
    }, fadeOutDuration * 1000);
}

// Standalone SE Effects for Game
function playTestSE(type) {
    initBgmAudio();
    const t = bgmCtx.currentTime;
    if (type === 'shot') {
        const osc = bgmCtx.createOscillator();
        const gain = bgmCtx.createGain();
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.08);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.08);
    } else if (type === 'explosion') {
        playIndustrialKick(t);
        playThunderEffect(t);
    } else if (type === 'item') {
        playPopSynth(noteFreq('E6'), t, 0.08);
        playPopSynth(noteFreq('B6'), t + 0.08, 0.15);
    }
}


function renderVisualizer() {
    requestAnimationFrame(renderVisualizer);
    const canvas = document.getElementById('visualizer-canvas');
    if (!canvas || !analyser) return;

    const ctx = canvas.getContext('2d');
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / bufferLength) * 2.5;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;

        // Gradient bar based on frequency intensity
        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#3b82f6');
        gradient.addColorStop(0.5, '#8b5cf6');
        gradient.addColorStop(1, '#ec4899');

        ctx.fillStyle = gradient;
        ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);

        x += barWidth + 1;
    }
}

const movementKeys=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','s','d','w','x']);
let shooterPaused=false, shooterLastFrame=null, shooterAccumulator=0;
const shooterStep=1000/60;
const pauseButton=document.createElement('button');pauseButton.id='shooterPause';pauseButton.type='button';pauseButton.textContent='Ⅱ ポーズ';pauseButton.setAttribute('aria-label','ゲームを一時停止');
const pauseLayer=document.createElement('div');pauseLayer.id='shooterPauseLayer';pauseLayer.hidden=true;pauseLayer.innerHTML='<div><h2>一時停止</h2><p>準備ができたら、続きから遊ぼう。</p><button type="button" id="shooterResume">▶ 再開</button></div>';
document.body.append(pauseButton,pauseLayer);
const pauseStyle=document.createElement('style');pauseStyle.textContent='#shooterPause{position:fixed;right:max(12px,env(safe-area-inset-right));top:58px;z-index:50;min-height:44px;padding:8px 14px;border:2px solid #8bdfff;border-radius:14px;background:#102d50;color:white;font:700 14px system-ui}#shooterPauseLayer{position:fixed;inset:48px 0 0;z-index:60;background:#06152ddd;display:grid;place-items:center;text-align:center;color:white}#shooterPauseLayer[hidden]{display:none}#shooterPauseLayer>div{padding:24px;max-width:90vw}#shooterResume{min-height:48px;padding:10px 30px;border:2px solid white;border-radius:14px;background:#ffe45c;color:#102d50;font:800 18px system-ui}';document.head.append(pauseStyle);
function clearShooterInput(){for(const k of Object.keys(keys))delete keys[k];down=false;}
function setShooterPaused(value){
 if(value&&state!=='play'&&state!=='stageclear') {clearShooterInput();return;}
 if(!value&&document.hidden)return;
 shooterPaused=value;clearShooterInput();shooterLastFrame=null;shooterAccumulator=0;
 pauseLayer.hidden=!value;pauseButton.textContent=value?'▶ 再開':'Ⅱ ポーズ';pauseButton.setAttribute('aria-label',value?'ゲームを再開':'ゲームを一時停止');
 for(const ctx of [ac,bgmCtx])if(ctx&&ctx.state!=='closed'){const action=value?ctx.suspend():ctx.resume();action?.catch(()=>{});}
 if(value)document.getElementById('shooterResume').focus();else c.focus({preventScroll:true});
}
pauseButton.addEventListener('click',()=>setShooterPaused(!shooterPaused));
document.getElementById('shooterResume').addEventListener('click',()=>setShooterPaused(false));
addEventListener('keydown',e=>{if(e.target instanceof HTMLElement&&e.target.closest('button,input,select,textarea'))return;if(e.key==='Escape'){e.preventDefault();if(!e.repeat)setShooterPaused(!shooterPaused);return;}if(shooterPaused)return;if(movementKeys.has(e.key))e.preventDefault();keys[e.key]=1;});
addEventListener('keyup',e=>{delete keys[e.key];if(movementKeys.has(e.key))e.preventDefault();});
addEventListener('blur',()=>setShooterPaused(true));
addEventListener('pagehide',()=>setShooterPaused(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)setShooterPaused(true);});
pad.addEventListener('lostpointercapture',()=>{down=false;});
function keyMove(){if(state!=='play')return;if(keys[' ']||keys.x){useBurst();keys[' ']=0;keys.x=0}let v=5;if(keys.ArrowLeft||keys.a)p.x=clamp(p.x-v,25,W-25);if(keys.ArrowRight||keys.d)p.x=clamp(p.x+v,25,W-25);if(keys.ArrowUp||keys.w)p.y=clamp(p.y-v,95,H-55);if(keys.ArrowDown||keys.s)p.y=clamp(p.y+v,95,H-55)}
function advanceShooterClock(ts){
 if(shooterLastFrame===null)shooterLastFrame=ts;
 const elapsed=Math.min(100,Math.max(0,ts-shooterLastFrame));shooterLastFrame=ts;
 if(!shooterPaused&&!document.hidden){shooterAccumulator+=elapsed;let steps=0;while(shooterAccumulator+1e-7>=shooterStep&&steps<6){keyMove();update();shooterAccumulator-=shooterStep;steps++;}}
 else shooterAccumulator=0;
}
function loop(ts){advanceShooterClock(ts);pauseButton.hidden=state!=='play'&&state!=='stageclear';draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
