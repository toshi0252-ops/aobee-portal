<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星の神殿 REMASTER 戦闘試作</title><style>*{box-sizing:border-box}body{margin:0;background:#102828;color:#f8ebc7;font:16px system-ui;text-align:center}h1{font-size:clamp(16px,3vw,25px);margin:8px}#game{position:relative;max-width:960px;margin:auto}canvas{width:100%;display:block;aspect-ratio:16/9;touch-action:none;border:2px solid #8baf89}#hud{position:absolute;top:8px;left:12px;pointer-events:none;background:#122c27cb;padding:6px;border-radius:8px}#controls{display:flex;justify-content:space-between;align-items:center;padding:8px;gap:12px;max-width:960px;margin:auto;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,46px);gap:3px}button{touch-action:none;color:#fff;background:#34534d;border:1px solid #9ab8a1;border-radius:13px;font:bold 17px system-ui;min-height:46px}#attack{width:76px;height:76px;background:#a46d35;border-radius:50%}#reset{padding:0 12px}p{font-size:12px;margin:5px}@media(orientation:landscape) and (max-height:550px){h1,p{display:none}#game{width:calc((100dvh - 12px)*16/9);max-width:calc(100vw - 190px)}#controls{position:fixed;inset:0;pointer-events:none;align-items:flex-end}#controls button{pointer-events:auto}#pad{grid-template-columns:repeat(3,37px)}#pad button{min-height:37px}#attack{width:64px;height:64px}#reset{position:fixed;right:8px;top:8px;font-size:12px;min-height:32px}}</style><h1>星の神殿 REMASTER — 森の戦闘試験</h1><div id="game"><canvas id="view" width="960" height="540" aria-label="戦闘試験場"></canvas><div id="hud"></div></div><div id="controls"><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="reset">再挑戦</button><button id="attack">攻撃</button></div><p>矢印 / WASD または左の方向ボタン・J / Space で攻撃。セーブなしの独立試作。</p><script src="src/action-core.js"></script><script src="src/trial-data.js"></script><script src="src/trial.js"></script></html>
