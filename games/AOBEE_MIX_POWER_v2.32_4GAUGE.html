<div class="card">MAX FLOW<br><b id="maxFlow">0</b></div><button id="sidePauseBtn" type="button" data-act="pause" class="side-pause">Ⅱ PAUSE</button><button id="gameTitleBtn" type="button" class="side-title">タイトルに戻る</button></div></div><div class="controls"><button data-act="left">←</button><button data-act="ccw">↶</button><button data-act="down">↓</button><button data-act="cw">↷</button><button data-act="right">→</button></div><div class="row2"><button data-act="drop">一気に落とす</button></div></div><script>(()=>{const root=document.getElementById('app');if(root.dataset.ready)return;root.dataset.ready='1';const W=6,H=12,icons=['⭐','⚙️','💧','❤️','⚡'];const boardEl=document.getElementById('board'),overlay=document.getElementById('overlay'),msg=document.getElementById('msg'),scoreEl=document.getElementById('score'),piecesEl=document.getElementById('pieces'),nextEl=document.getElementById('next'),fallState=document.getElementById('fallState'),powerFill=null,powerText=null,powerBtn=document.getElementById('powerBtn'),maxFlowEl=document.getElementById('maxFlow');const fxLayer=document.getElementById('fxLayer'),gameOverCard=document.getElementById('gameOverCard'),finalScore=document.getElementById('finalScore'),retryBtn=document.getElementById('retryBtn'),titleBtn=document.getElementById('titleBtn');let grid=[],pair=null,nextPair=null,running=false,paused=false,landing=false,last=0,acc=0,interval=900,score=0,pieces=0,raf=0,power=0,maxFlow=0;let mixPower=[0,0,0,0];const rnd=()=>Math.floor(Math.random()*icons.length);const pauseCard=document.getElementById('pauseCard');
const pauseButton=document.querySelector('[data-act="pause"]');
const waruTimerEl=document.getElementById('waruTimer'),powerStockEl=document.getElementById('powerStock'),waruNeedEl=document.getElementById('waruNeed'),battleFx=document.getElementById('battleFx'),battleFxText=document.getElementById('battleFxText');
const waruStage=waruTimerEl.closest('.warubee-stage');
let powerStocks=0,waruLevel=1,waruNeed=1,waruCountdown=25,waruClock=0;const GARBAGE=5;
function resetGrid(){grid=Array.from({length:H},()=>Array(W).fill(null))}function makePair(){return [rnd(),rnd()]}function cells(p=pair){if(!p)return[];const dirs=[[0,-1],[1,0],[0,1],[-1,0]],d=dirs[p.rot];return[{x:p.x,y:p.y,t:p.a},{x:p.x+d[0],y:p.y+d[1],t:p.b}]}function valid(p){return cells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&grid[c.y][c.x]===null)}function spawn(){const n=nextPair||makePair();nextPair=makePair();pair={x:2,y:1,rot:0,a:n[0],b:n[1]};if(!valid(pair)){running=false;pair=null;msg.textContent='GAME OVER';fallState.textContent='停止';showGameOver();return}render()}function move(dx,dy){if(!running||paused||landing||!pair)return;const n={...pair,x:pair.x+dx,y:pair.y+dy};if(valid(n)){pair=n;render();return true}if(dy>0){lock()}return false}function rotate(dr){if(!running||paused||landing||!pair)return;let n={...pair,rot:(pair.rot+dr+4)%4};if(valid(n)){pair=n;render();return}for(const k of[-1,1]){const q={...n,x:n.x+k};if(valid(q)){pair=q;render();return}}}function neighbors(x,y){
  return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]
    .filter(([nx,ny])=>nx>=0&&nx<W&&ny>=0&&ny<H);
}

function collectGroup(sx,sy,visited){
  const type=grid[sy][sx];
  const out=[];
  const stack=[[sx,sy]];
  visited.add(sx+','+sy);
  while(stack.length){
    const [x,y]=stack.pop();
    out.push([x,y]);
    for(const [nx,ny] of neighbors(x,y)){
      const key=nx+','+ny;
      if(!visited.has(key)&&grid[ny][nx]===type){
        visited.add(key);
        stack.push([nx,ny]);
      }
    }
  }
  return out;
}

function findMatches(snapshot=grid){
  const visited=new Set();
  const matches=[];
  const same=(x,y,type)=>type!==GARBAGE&&snapshot[y][x]===type;

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const type=snapshot[y][x];
      if(type===null)continue;
      const start=x+','+y;
      if(visited.has(start))continue;

      const group=[];
      const stack=[[x,y]];
      visited.add(start);

      while(stack.length){
        const [cx,cy]=stack.pop();
        group.push([cx,cy]);
        for(const [nx,ny] of neighbors(cx,cy)){
          const key=nx+','+ny;
          if(!visited.has(key)&&same(nx,ny,type)){
            visited.add(key);
            stack.push([nx,ny]);
          }
        }
      }

      if(group.length>=4)matches.push({type,cells:group});
    }
  }
  return matches;
}

function clearStableBoardOnce(){
  const snapshot=grid.map(r=>r.slice()),matches=findMatches(snapshot);
  if(!matches.length)return {removed:0,types:[]};
  const kill=new Map();
  for(const m of matches){if(m.cells.length<4)continue;for(const [x,y] of m.cells){
    kill.set(x+','+y,[x,y,m.type]);
    for(const [nx,ny] of neighbors(x,y))if(snapshot[ny][nx]===GARBAGE)kill.set(nx+','+ny,[nx,ny,GARBAGE]);
  }}
  let removed=0;for(const [x,y,t] of kill.values())if(grid[y][x]===t){grid[y][x]=null;removed++;}
  return {removed,types:[...new Set(matches.map(m=>m.type))]};
}

function clearGarbage(limit=99){
  let removed=0;
  for(let y=H-1;y>=0&&removed<limit;y--)for(let x=0;x<W&&removed<limit;x++){
    if(grid[y][x]===GARBAGE){grid[y][x]=null;removed++;}
  }
  return removed;
}

function applyMix(types,flow,fired){
  const ready=(a,b)=>types.has(a)&&types.has(b)&&mixPower[a]>=100&&mixPower[b]>=100;
  const effects=[];
  let totalExtra=0,totalBonus=0;

  const fire=(key,name,a,b,bonus,fn)=>{
    if(fired.has(key)||!ready(a,b))return;
    fired.add(key);
    mixPower[a]=0;mixPower[b]=0;
    const extra=fn();
    totalExtra+=extra;
    totalBonus+=bonus+extra*15;
    effects.push(name);
  };

  if(ready(0,2))fire('star-splash','STAR SPLASH',0,2,250*flow,()=>{
    let extra=0;
    for(let x=0;x<W;x++)for(let y=H-1;y>=0;y--){
      if(grid[y][x]!==null){grid[y][x]=null;extra++;break;}
    }
    return extra;
  });

  /* Four-element MIX system: gear + heart is the second offensive MIX. */
  if(ready(1,3))fire('gear-heart','GEAR HEART',1,3,300*flow,()=>{
    let extra=0;
    const col=flow%2?2:3;
    for(let y=0;y<H;y++)if(grid[y][col]!==null){grid[y][col]=null;extra++;}
    return extra;
  });

  if(ready(2,3))fire('heal-rain','HEAL RAIN',2,3,220*flow,()=>{
    const extra=clearGarbage(6);
    waruCountdown+=8;
    return extra;
  });

  syncPower();
  if(!effects.length)return {extra:0,names:[]};
  score+=totalBonus;
  scoreEl.textContent=score;
  msg.textContent='MIX! '+effects.join(' + ');
  showFx('MIX! '+effects.join(' + '));
  boardEl.classList.remove('mix-flash');void boardEl.offsetWidth;boardEl.classList.add('mix-flash');
  setTimeout(()=>boardEl.classList.remove('mix-flash'),650);
  return {extra:totalExtra,names:effects};
}

function gravityStep(){
  let moved=false;
  for(let y=H-2;y>=0;y--){
    for(let x=0;x<W;x++){
      if(grid[y][x]!==null&&grid[y+1][x]===null){
        grid[y+1][x]=grid[y][x];
        grid[y][x]=null;
        moved=true;
      }
    }
  }
  return moved;
}
function gravity(){
  let guard=0;
  while(gravityStep()&&guard++<H){}
}

 if(flow>=3){board.classList.remove('flow-shake');void board.offsetWidth;board.classList.add('flow-shake');}

function resolveBoard(){
  if(!running)return;
  landing=true;
  let flow=0;
  const flowTypes=new Set();
  const firedMixes=new Set();

  const settleVisual=()=>{
    const moved=gravityStep();
    render();
    if(moved){setTimeout(settleVisual,55);return;}
    setTimeout(checkChain,120);
  };

  const checkChain=()=>{
    const matches=findMatches();
    if(matches.length===0){
      landing=false;
      render();
      spawn();
      return;
    }

    flow++;
    const cleared=clearStableBoardOnce();
    const removed=cleared.removed;
    if(!removed){
      landing=false;
      render();
      spawn();
      return;
    }

    score+=removed*10*flow;
    addElementPower(cleared.types,removed,flow);
    for(const t of cleared.types)flowTypes.add(t);
    const mixResult=applyMix(flowTypes,flow,firedMixes);

    maxFlowEl.textContent=maxFlow;
    scoreEl.textContent=score;
    if(!mixResult.names.length)msg.textContent=flow+' FLOW!';

    playFlowFx(flow);

    setTimeout(settleVisual,360);

function showFx(text){fxLayer.innerHTML='';const d=document.createElement('div');d.className='fx-text';d.textContent=text;fxLayer.appendChild(d);setTimeout(()=>{if(d.parentNode)d.remove()},700)}

function lock(){

function start(){powerStocks=0;waruLevel=1;waruNeed=1;waruCountdown=25;waruClock=0;landing=false;pauseCard.classList.remove('show');if(pauseButton)pauseButton.textContent='Ⅱ PAUSE';gameOverCard.classList.remove('show');fxLayer.innerHTML='';cancelAnimationFrame(raf);resetGrid();score=0;pieces=0;power=0;maxFlow=0;scoreEl.textContent='0';piecesEl.textContent='0';maxFlowEl.textContent='0';syncPower();nextPair=makePair();running=true;paused=false;overlay.style.display='none';msg.textContent='あおびーと5つの力！';fallState.textContent='動作中';last=performance.now();acc=0;spawn();updateBattleHud();raf=requestAnimationFrame(loop)}function togglePause(){

}function loop(t){if(!running){render();return}const dt=Math.min(100,t-last);last=t;battleTick(dt);if(!paused&&!landing){acc+=dt;if(acc>=interval){acc-=interval;move(0,1)}}else if(landing){acc=0}raf=requestAnimationFrame(loop)}function render(){const active=new Map();for(const c of cells())active.set(c.x+','+c.y,c.t);let html='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=active.has(x+','+y)?active.get(x+','+y):grid[y][x];html+='<div class="cell">'+(t!==null?'<div class="orb"><span class="token t'+t+'">'+(t===GARBAGE?'▣':icons[t])+'</span></div>':'')+'</div>'}boardEl.innerHTML=html;nextEl.innerHTML=nextPair?'<div class="next-token"><span class="token t'+nextPair[0]+'">'+icons[nextPair[0]]+'</span></div><div class="next-token"><span class="token t'+nextPair[1]+'">'+icons[nextPair[1]]+'</span></div>':''}function act(a){if(a==='left')move(-1,0);else if(a==='right')move(1,0);else if(a==='down')move(0,1);else if(a==='ccw')rotate(-1);else if(a==='cw')rotate(1);else if(a==='drop')hardDrop();else if(a==='pause')togglePause()}document.getElementById('start').addEventListener('click',start);

/* v2.20 Android touch controls — direct listeners on the board itself. */
(()=>{
  const board=document.querySelector('.board');
  if(!board)return;
  let sx=0,sy=0,started=0,moved=false;

  function flash(x,y,t){
    const f=document.createElement('div');f.className='tap-feedback';f.textContent=t;
    f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);
    setTimeout(()=>f.remove(),300);
  }
  function controlButtons(){
    return [...document.querySelectorAll('.controls button')];
  }
  function pressByText(parts){
    const b=controlButtons().find(el=>parts.some(p=>el.textContent.trim().includes(p)));
    if(b){ b.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:1,pointerType:'touch'})); return true; }
    return false;
  }
  function pressZone(q,x,y){
    const buttons=controlButtons();
    /* Stable v1/v2 control order: left, CCW, down, CW, right, hard-drop. */
    const candidates=[buttons[0],buttons[1],buttons[3],buttons[4]];
    const b=candidates[q];
    if(b){
      b.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:1,pointerType:'touch'}));
      flash(x,y,['←','↺','↻','→'][q]);
    }
  }

  board.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;started=performance.now();moved=false;
    e.preventDefault();
  },{passive:false});

  board.addEventListener('touchmove',e=>{ e.preventDefault(); },{passive:false});

  board.addEventListener('touchend',e=>{
    if(!e.changedTouches.length)return;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=performance.now()-started;

    if(Math.hypot(dx,dy)<=30&&dt<800){
      const r=board.getBoundingClientRect();
      const q=Math.max(0,Math.min(3,Math.floor((t.clientX-r.left)/r.width*4)));
      pressZone(q,t.clientX,t.clientY);
      e.preventDefault();
    }
  },{passive:false});
})();
