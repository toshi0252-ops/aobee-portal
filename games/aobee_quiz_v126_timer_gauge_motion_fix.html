function renderGenres(){let g=$('#genreGrid');g.innerHTML='';defs.forEach(([id,label])=>{let p=id==='all'?bank:bank.filter(x=>x.g===id),b=document.createElement('button');b.className='gbtn'+(id==='all'?' all':'');b.innerHTML=label+'<small>'+p.length+'問</small>';b.disabled=p.length<10;b.addEventListener('click',()=>{selectedGenre=id;genreLabel=label.replace(/^..\s?/,'');screen('settings')});g.appendChild(b)})}
function difficultyScore(x){
 const q=x.q||'',a=x.a||'',cand=(x.c||[]);
 let z=50;
 if(/何年|西暦|何世紀|何代|何条|何番|何月何日/.test(q))z+=16;
 if(/誰|著者|作者|監督|作曲|作詞|提唱|発見|発明|創設|創業|条約|法則|元素|学名/.test(q))z+=12;
 if(/正式名称|本名|別名|由来|語源|原題|旧称/.test(q))z+=10;
 if(/どれ|何色|何個|何本|何人/.test(q))z-=5;
 if(q.length>=65)z+=9;else if(q.length>=45)z+=5;else if(q.length<=25)z-=7;
 if(/[0-9０-９]/.test(a))z+=5;
 if(a.length>=12)z+=6;else if(a.length<=4)z-=3;
 const norm=t=>(t||'').replace(/[・\s　\-ー]/g,'').toLowerCase();
 const sim=(u,v)=>{u=norm(u);v=norm(v);if(!u||!v)return 0;const U=new Set(u),V=new Set(v),ov=[...U].filter(c=>V.has(c)).length;return ov/Math.max(U.size,V.size)};
 const sims=cand.filter(v=>v&&v!==a).map(v=>sim(a,v)).sort((x,y)=>y-x);
 if((sims[0]||0)>=.65)z+=12;else if((sims[0]||0)>=.45)z+=7;
 if((sims[1]||0)>=.40)z+=5;
 return Math.max(0,Math.min(100,z));
}
function difficultyPool(p){
 const a=p.map(x=>({x,s:difficultyScore(x)})).sort((u,v)=>u.s-v.s),n=a.length;
 let lo=0,hi=n;
 if(difficulty==='easy'){hi=Math.max(10,Math.ceil(n*.38))}
 else if(difficulty==='normal'){lo=Math.floor(n*.25);hi=Math.max(Math.floor(n*.75),Math.min(n,10))}
 else{lo=Math.floor(n*.62)}
 return a.slice(lo,hi).map(o=>o.x);
}
function wrongChoices(x){
 const all=(x.c||[]).filter(v=>v&&v!==x.a);
 if(all.length<=3)return shuffle(all).slice(0,3);
 const norm=t=>(t||'').replace(/[・\s　\-ー]/g,'').toLowerCase();
 const sim=(u,v)=>{u=norm(u);v=norm(v);if(!u||!v)return 0;const U=new Set(u),V=new Set(v),ov=[...U].filter(c=>V.has(c)).length;return ov/Math.max(U.size,V.size)};
 const r=all.map(v=>({v,s:sim(x.a,v)})).sort((u,v)=>v.s-u.s);
 if(difficulty==='easy')return shuffle(r.slice(Math.floor(r.length*.45)).map(o=>o.v)).slice(0,3);
 if(difficulty==='hard')return shuffle(r.slice(0,Math.min(6,r.length)).map(o=>o.v)).slice(0,3);
 return shuffle(all).slice(0,3);
}
function setupRun(){const tb=document.querySelector('.timebtn.sel');timeLimit=tb?Number(tb.getAttribute('data-time'))||0:0;window.__AOBEE_TIME_LIMIT=timeLimit;stopTimer();pool=selectedGenre==='all'?bank:bank.filter(x=>x.g===selectedGenre);pool=difficultyPool(pool);let mm={'10':10,'20':20,'50':50};endless=mode[0]==='e';missLimit=endless?+mode.slice(1):0;limit=endless?pool.length:Math.min(mm[mode],pool.length);qs=shuffle(pool);idx=points=misses=corrects=0;screen('game');show()}
function stopTimer(){
 if(timerId){cancelAnimationFrame(timerId);clearInterval(timerId);timerId=null}
 let t=$('#quizTimer');
 if(t){t.style.display='none';t.innerHTML='';}
}
function startTimer(){
 if(timerId){cancelAnimationFrame(timerId);clearInterval(timerId);timerId=null}
 const t=$('#quizTimer');
 if(!t)return;
 if(!timeLimit){t.style.display='none';return}
 const total=timeLimit*1000, started=performance.now();
 timeLeft=timeLimit;
 t.className='quizTimer';
 /* decorative background gauge is ignored; this is the actual live gauge */
 t.style.cssText='display:block!important;position:absolute!important;left:13%!important;right:13%!important;top:27.7%!important;height:14px!important;z-index:9999!important;background:#263b66!important;border:3px solid #ffffff!important;border-radius:999px!important;overflow:visible!important;box-shadow:0 2px 7px #001b4066!important;';
 t.innerHTML='<div id="quizTimerFill" style="position:absolute;left:0;top:0;bottom:0;width:100%;background:#39d76b;border-radius:999px;transform-origin:left center;will-change:transform"></div><div id="quizTimerText" style="position:absolute;left:0;right:0;top:-27px;text-align:center;color:#17386e;font-weight:1000;font-size:16px;text-shadow:0 1px 2px white">残り '+timeLimit+'秒</div>';
 function frame(now){
   if(locked){stopTimer();return}
   const remain=Math.max(0,total-(now-started));
   timeLeft=Math.ceil(remain/1000);
   const ratio=remain/total;
   const fill=$('#quizTimerFill'),txt=$('#quizTimerText');
   if(!fill||!txt)return;
   /* transform guarantees visible motion even if width is overridden elsewhere */
   fill.style.transform='scaleX('+ratio+')';
   fill.style.background=timeLeft<=2?'#ff4057':timeLeft<=5?'#ffb22e':'#39d76b';
   txt.textContent='残り '+timeLeft+'秒';
   if(remain<=0){timerId=null;timeoutAnswer();return}
   timerId=requestAnimationFrame(frame);
 }
 timerId=requestAnimationFrame(frame);
}
function timeoutAnswer(){if(locked)return;locked=true;misses++;let x=qs[idx];document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===x.a){b.classList.add('good');b.textContent='⭕ '+b.textContent}});$('#msg').textContent='時間切れ！ 正解は「'+x.a+'」';$('#feedbackStamp').textContent='⏰ 時間切れ';$('#feedbackStamp').className='feedbackStamp ng';$('#next').classList.remove('hidden');let t=$('#quizTimer');t.textContent='⏰ 0';t.classList.remove('warn');t.classList.add('danger')}
function show(){if(idx>=qs.length)return finish();locked=false;$('#next').classList.add('hidden');$('#msg').textContent='';$('#feedbackStamp').className='feedbackStamp hidden';$('#feedbackStamp').textContent='';let x=qs[idx];$('#quizMeta').textContent=genreLabel+' ・ '+({easy:'かんたん',normal:'ふつう',hard:'むずかしい'}[difficulty])+(window.__DBG?' ['+difficultyScore(x)+']':'');$('#quizCount').textContent=endless?`Q ${idx+1} ♥${Math.max(0,missLimit-misses)}`:`${idx+1} / ${limit}問`;$('#question').textContent=x.q;let wrong=wrongChoices(x),opts=shuffle([x.a,...wrong]),box=$('#answers');box.innerHTML='';opts.forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.addEventListener('click',()=>answer(b,v,x.a));box.appendChild(b)});startTimer()}
function answer(btn,v,a){if(locked)return;stopTimer();locked=true;document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===a){b.classList.add('good');b.textContent='⭕ '+b.textContent}});if(v===a){points+=100;corrects++;$('#msg').textContent='正解！';$('#feedbackStamp').textContent='⭕ 正解！';$('#feedbackStamp').className='feedbackStamp ok'}else{misses++;btn.classList.add('bad');btn.textContent='❌ '+btn.textContent;$('#msg').textContent='正解は「'+a+'」';$('#feedbackStamp').textContent='❌ 不正解';$('#feedbackStamp').className='feedbackStamp ng'}$('#next').classList.remove('hidden')}
function next(){idx++;if((!endless&&idx>=limit)||(endless&&misses>=missLimit))finish();else show()}
function key(){return `aobee_best_${selectedGenre}_${difficulty}_${mode}`}
function finish(){
 stopTimer();screen('result');
 let plays=+(localStorage.getItem('aobee_stat_plays')||0)+1;
 localStorage.setItem('aobee_stat_plays',plays);
 localStorage.setItem('aobee_stat_correct',+(localStorage.getItem('aobee_stat_correct')||0)+corrects);
 if(!endless && corrects===limit)localStorage.setItem('aobee_stat_perfect',+(localStorage.getItem('aobee_stat_perfect')||0)+1);
 let now=endless?corrects:points,old=+(localStorage.getItem(key())||0);
 if(now>old){old=now;localStorage.setItem(key(),old)}
 let answered=Math.max(1,idx+(locked?1:0));
 let rate=endless
   ? (corrects>=30?100:corrects>=20?75:corrects>=10?55:corrects>=5?35:Math.min(19,corrects*4))
   : Math.round(corrects/Math.max(1,limit)*100);
 let tier=rate>=80?4:rate>=60?3:rate>=40?2:rate>=20?1:0;
 let perfect=!endless && corrects===limit;
 let rewardKey;
 if(perfect) rewardKey='perfect';
 else if(rate>=80) rewardKey='high';
 else if(rate>=60) rewardKey='mid';
 else if(rate>=20) rewardKey='low';
 else rewardKey='fail';
 $('#resultArt').src=REWARD_ART[rewardKey];
 $('#resultArt').className='resultArt'+(perfect?' perfect':'');
 $('#finalScore').textContent=endless?corrects+'問正解':points+'点';
 $('#resultRate').textContent=endless?'エンドレス記録：'+corrects+'問':'正解率 '+rate+'%（'+corrects+' / '+limit+'問）';
 $('#best').textContent='🏆 ベスト：'+(endless?old+'問':old+'点');
 $('#rank').textContent=perfect?'パーフェクト！':rate>=80?'あとちょっとで満点！':rate>=60?'いい感じだよ！':rate>=20?'もう少し！きっとできる！':'またチャレンジしよう！';
}

$('#how').onclick=()=>{$('#modalTitle').textContent='遊び方';$('#modalBody').innerHTML='<p>ジャンル、難易度、問題数またはエンドレスを選んで4択クイズに挑戦！</p><p>エンドレスは1・3・5ミス終了から選べます。</p><p>制限時間は「なし・15秒・10秒・5秒」から選択。時間切れは不正解扱いで、エンドレスでは1ミスとして数えます。</p>';screen('modal')};$('#high').onclick=()=>{
 const genreMap=Object.fromEntries(defs.map(x=>[x[0],x[1].replace(/^[^\s]+\s*/,'')]));
 const diffMap={easy:'かんたん',normal:'ふつう',hard:'むずかしい'};
 let rows=[];
 for(let i=0;i<localStorage.length;i++){

   if(parts.length<3)continue;
   const g=parts[0],d=parts[1],m=parts.slice(2).join('_'),v=+(localStorage.getItem(k)||0);
   rows.push({g,d,m,v,end:m.startsWith('e')});
 }
 rows.sort((a,b)=>b.v-a.v);
 const plays=+(localStorage.getItem('aobee_stat_plays')||0);
 const totalCorrect=+(localStorage.getItem('aobee_stat_correct')||0);
 const perfect=+(localStorage.getItem('aobee_stat_perfect')||0);
 const medals=['🥇','🥈','🥉'];
 const top=rows.slice(0,8).map((r,i)=>{
   const modeName=r.end?('∞ '+r.m.slice(1)+'ミス終了'):(r.m+'問');
   const val=r.end?(r.v+'問'):(r.v+'点');
   return `<div class="hsRow"><div class="hsRank">${medals[i]||'⭐'}</div><div class="hsName">${genreMap[r.g]||r.g}<small>${diffMap[r.d]||r.d} ・ ${modeName}</small></div><div class="hsValue">${val}</div></div>`;
 }).join('');
 $('#modalTitle').textContent='';
 $('#modalBody').innerHTML=`<div class="hsHero"><div class="hsTrophy">🏆</div><h2>あおびー記録の部屋</h2><div class="hsSub">いっぱい遊んで記録を埋めよう！</div></div>
 <div class="hsStats"><div class="hsStat"><b>${plays}</b><span>プレイ回数</span></div><div class="hsStat"><b>${totalCorrect}</b><span>累計正解</span></div><div class="hsStat"><b>${perfect}</b><span>満点回数</span></div></div>
 <div class="hsStars">${perfect>=10?'⭐⭐⭐⭐⭐':perfect>=5?'⭐⭐⭐⭐☆':perfect>=3?'⭐⭐⭐☆☆':perfect>=1?'⭐⭐☆☆☆':'⭐☆☆☆☆'}</div>
 <div class="hsBoard"><div class="hsBoardTitle">✨ ベストレコード ✨</div>${top||'<div class="hsEmpty">まだ記録がないよ！<br>クイズに挑戦して最初の記録を作ろう。</div>'}</div>
 <div class="hsFooter">ジャンル × 難易度 × モードごとの自己ベスト</div>`;

};
