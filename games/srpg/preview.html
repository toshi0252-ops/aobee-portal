<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>あおびー大戦（仮）｜序盤縦切り 第1〜5面</title>
<style>
/* 共通パネル部品: 画面下部（縦）／右側（横）の両配置で同じ中身を使う */
#panel {
  background: #111827;
  border-top: 2px solid #334155;
  padding: 8px;
  overflow-y: auto;
  font-size: 13px;
  color: #e2e8f0;
}
body.landscape #panel {
  border-top: none;
  border-left: 2px solid #334155;
}
#panel h3 { margin: 2px 0 6px; font-size: 14px; }

#panel button {
  background: #1f2937; color: #e2e8f0; border: 1px solid #4b5563;

#panel .bar.sp i { background: #f59e0b; }
#panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
#panel td, #panel th { border: 1px solid #334155; padding: 4px 6px; text-align: left; }

</style>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0f172a;color:#e2e8f0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;background:#1e3a5f;padding:6px 10px;font-size:13px;font-weight:700;flex-wrap:wrap}
header .spacer{flex:1}header button{background:#0ea5e9;border:none;color:#fff;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
header button.sub{background:#334155}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#mapwrap{padding:6px;display:flex;justify-content:center}

body.landscape #grid{width:min(100%,calc((100dvh - 70px)*1.333))}

.cell.hl-move{outline:2px solid #38bdf8;outline-offset:-2px;background-image:linear-gradient(rgba(56,189,248,.35),rgba(56,189,248,.35))}
.cell.hl-attack{outline:2px solid #f87171;outline-offset:-2px;background-image:linear-gradient(rgba(248,113,113,.35),rgba(248,113,113,.35))}
.chip-unit{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#111;border:2px solid rgba(255,255,255,.7);z-index:2}

@keyframes pop{0%{transform:translateY(6px);opacity:0}25%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
#title-screen{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#1e3a5f,#0f172a);text-align:center;padding:16px}
#title-screen h1{font-size:30px;margin:0;color:#7dd3fc}
#title-screen .sub{color:#94a3b8;font-size:13px;max-width:520px;line-height:1.7}
#title-screen button{background:#0369a1;color:#fff;border:1px solid #38bdf8;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;min-width:240px}
#title-screen button:disabled{opacity:.4}
#title-screen button.sub{background:#1f2937;border-color:#4b5563;font-weight:400}
.hidden{display:none!important}
.battle-scene{position:fixed;inset:0;background:linear-gradient(#7dd3fc 0 55%,#65a30d 55%);z-index:80}
.bs-quote{position:absolute;top:10px;left:10px;right:10px;background:rgba(2,6,23,.88);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px}

.bs-right .bs-sprite{color:#fff}

.bs-shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bs-bars{position:absolute;left:0;right:0;bottom:0;background:rgba(2,6,23,.9);color:#fff;display:flex;justify-content:space-between;padding:8px 14px;font-size:13px}
.bs-skip{position:absolute;top:64px;right:10px;background:#f59e0b;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
#log{font-size:11px;color:#94a3b8;max-height:90px;overflow-y:auto;line-height:1.5}
</style></head><body>
<div id="title-screen">
  <h1>あおびー大戦（仮）</h1>
  <div class="sub">スパロボ風SLG・序盤縦切り版（第1〜5面）／プレビュー単一ファイル版<br>縦画面：下部パネル＋簡略戦闘 ／ 横画面：右パネル＋戦闘アニメ<br>ユニットは仮チップ表示です</div>

<script>
"use strict";
/* Panel部品: 中身の入れ替え表示だけを担当する（配置はCSS側） */
(function (global) {
  function Panel(el) { this.el = el; }
  Panel.prototype.show = function (html) { this.el.innerHTML = html; };
  Panel.prototype.buttons = function (items) {
    // items: [{label, cls, disabled, onClick}]
    const row = document.createElement("div"); row.className = "row";
    for (const it of items) {
      const b = document.createElement("button");
      b.textContent = it.label; if (it.cls) b.className = it.cls;
      if (it.disabled) b.disabled = true;
      b.addEventListener("click", it.onClick);
      row.appendChild(b);
    }
    this.el.appendChild(row);
    return row;
  };
  Panel.prototype.unitCard = function (u) {
    const hpPct = Math.max(0, Math.round(u.hp / u.maxHp * 100));
    const enPct = u.maxEn ? Math.round(u.en / u.maxEn * 100) : 0;
    const spPct = u.maxSp ? Math.round(u.sp / u.maxSp * 100) : 0;
    return "<h3>" + u.name + "／" + u.unitName + " Lv" + u.level + " 気力" + u.morale + "</h3>" +
      "<div class='stat'>HP " + u.hp + "/" + u.maxHp + "</div><div class='bar'><i style='width:" + hpPct + "%'></i></div>" +
      (u.maxEn ? "<div class='stat'>EN " + u.en + "/" + u.maxEn + "</div><div class='bar en'><i style='width:" + enPct + "%'></i></div>" : "") +
      (u.maxSp ? "<div class='stat'>SP " + u.sp + "/" + u.maxSp + "</div><div class='bar sp'><i style='width:" + spPct + "%'></i></div>" : "");
  };
  global.Panel = Panel;
})(window);

</script>
<script>
"use strict";
/* Dialog部品: 会話ウィンドウ。lines = [[who, text], ...] を順に表示し、終わったら resolve する */
(function (global) {
  const NAMES = { aobee: "あおびー", warubee: "わるびー", galdo: "ガルド", marmi: "マーミ", poco: "ポコ", minori: "みのり", mio: "ミオ", ganzou: "ガンジョウ" };
  const COLORS = { aobee: "#38bdf8", warubee: "#e879f9", galdo: "#d97706", marmi: "#f472b6", poco: "#4ade80", minori: "#facc15", mio: "#a78bfa", ganzou: "#94a3b8" };
  function showDialog(lines) {
    return new Promise(resolve => {
      const ov = document.createElement("div");
      ov.style.cssText = "position:fixed;inset:0;background:rgba(2,6,23,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60";
      const box = document.createElement("div");
      box.style.cssText = "background:rgba(15,23,42,.96);border:2px solid #475569;border-radius:12px;margin:10px;padding:12px 14px;max-width:640px;width:100%;color:#e2e8f0;min-height:96px;cursor:pointer";
      ov.appendChild(box); document.body.appendChild(ov);
      let i = 0;
      function render() {
        if (i >= lines.length) { document.body.removeChild(ov); resolve(); return; }
        const [who, text] = lines[i];
        box.innerHTML = "<div style='font-weight:700;color:" + (COLORS[who] || "#e2e8f0") + "'>" + (NAMES[who] || who) + "</div><div style='margin-top:4px;line-height:1.6'>" + text + "</div><div style='text-align:right;color:#64748b;font-size:11px'>タップで進む ▼</div>";
      }
      ov.addEventListener("click", () => { i++; render(); });
      render();
    });
  }
  global.showDialog = showDialog;
})(window);

</script>
<script>
"use strict";
/* GridMap部品: マップ描画・範囲ハイライト・タップ判定 */
(function (global) {
  const TERR_CLASS = { ".": "t-plain", P: "t-path", G: "t-gear", F: "t-forest", V: "t-village", R: "t-river", W: "t-water", L: "t-lamp", X: "t-block" };
  function GridMap(el, onTap) {
    this.el = el; this.onTap = onTap;
    this.moveTiles = new Map(); this.attackTiles = new Set();
  }
  GridMap.prototype.setHighlights = function (moveTiles, attackTiles) {
    this.moveTiles = new Map((moveTiles || []).map(t => [t.x + "," + t.y, t]));
    this.attackTiles = new Set((attackTiles || []).map(t => t.x + "," + t.y));
  };
  GridMap.prototype.render = function (st) {
    const stage = st.stage, w = stage.terrain[0].length, h = stage.terrain.length;
    this.el.innerHTML = "";
    this.el.style.gridTemplateColumns = "repeat(" + w + ",1fr)";
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const cell = document.createElement("div");
      const ch = stage.terrain[y][x];
      cell.className = "cell " + (TERR_CLASS[ch] || "t-plain");
      const k = x + "," + y;
      if (this.moveTiles.has(k)) cell.classList.add("hl-move");
      if (this.attackTiles.has(k)) cell.classList.add("hl-attack");
      const u = st.units.find(u => u.hp > 0 && u.x === x && u.y === y);
      if (u) {
        const chip = document.createElement("div");
        chip.className = "chip-unit " + u.side + (u.acted && u.side === "ally" ? " acted" : "") + (u.boss ? " boss" : "");
        chip.style.background = u.color;
        chip.textContent = u.side === "npc" ? "動" : (u.pilotId ? u.name.slice(0, 1) : u.name.slice(0, 1));
        chip.title = u.name + "／" + u.unitName + " HP" + u.hp;
        cell.appendChild(chip);
        if (u.side !== "npc") {
          const bar = document.createElement("div"); bar.className = "mini-hp";
          const i = document.createElement("i"); i.style.width = Math.max(0, u.hp / u.maxHp * 100) + "%";
          bar.appendChild(i); cell.appendChild(bar);
        }
      }
      cell.addEventListener("click", () => this.onTap(x, y));
      this.el.appendChild(cell);
    }
  };
  global.GridMap = GridMap;
})(window);

</script>
<script>
"use strict";
/* Battle部品: 簡略戦闘（マップ上の数字ポップ）と横画面用戦闘シーン */
(function (global) {
  // 簡略: マップのセル上にダメージ数字をポップ表示する
  function showPop(gridEl, st, ev) {
    return new Promise(resolve => {
      const w = st.stage.terrain[0].length;
      const idx = ev.defY * w + ev.defX;
      const cell = gridEl.children[idx];
      if (!cell) { resolve(); return; }
      const pop = document.createElement("div");
      pop.className = "dmg-pop";
      pop.textContent = ev.type === "heal" ? "+" + ev.amount : (ev.hit ? "-" + ev.dmg : "MISS");
      if (ev.killed) pop.textContent += " 撃墜!";
      cell.appendChild(pop);
      setTimeout(() => { pop.remove(); resolve(); }, 650);
    });
  }
  async function playSimplified(gridEl, st, events) {
    for (const ev of events) {
      if (ev.type === "attack" || ev.type === "heal") await showPop(gridEl, st, ev);
    }
  }
  // 横画面用シーン: 左右対峙・HPバー・セリフ・スキップ可の簡易アニメーション
  function playScene(atkU, defU, events, firstForecast) {
    return new Promise(resolve => {
      const ov = document.createElement("div");
      ov.className = "battle-scene";
      const main = events.find(e => e.type === "attack");
      const counter = events.filter(e => e.type === "attack")[1];
      ov.innerHTML =
        "<div class='bs-sky'><div class='bs-quote'></div>" +
        "<div class='bs-unit bs-left'><div class='bs-sprite' style='background:" + atkU.color + "'>" + atkU.name + "</div><div class='bs-name'>" + atkU.unitName + "</div></div>" +
        "<div class='bs-unit bs-right'><div class='bs-sprite' style='background:" + defU.color + "'>" + defU.name + "</div><div class='bs-name'>" + defU.unitName + "</div></div>" +
        "<div class='bs-bars'><div>HP " + atkU.hp + "/" + atkU.maxHp + "</div><div>HP " + defU.hp + "/" + defU.maxHp + "</div></div></div>" +
        "<button class='bs-skip'>スキップ ≫</button>";
      document.body.appendChild(ov);
      const quote = ov.querySelector(".bs-quote");
      const left = ov.querySelector(".bs-left"), right = ov.querySelector(".bs-right");
      let done = false;
      const finish = () => { if (!done) { done = true; ov.remove(); resolve(); } };
      ov.querySelector(".bs-skip").addEventListener("click", finish);
      const steps = [];
      if (main) steps.push({ el: left, foe: right, ev: main, who: atkU });
      if (counter) steps.push({ el: right, foe: left, ev: counter, who: defU });
      let i = 0;
      function next() {
        if (i >= steps.length) { setTimeout(finish, 500); return; }
        const s = steps[i++];
        quote.textContent = s.who.name + "「" + s.ev.weapon + "！」 " + (s.ev.hit ? s.ev.dmg + "ダメージ" : "回避された");
        s.el.classList.add("bs-dash");
        setTimeout(() => { s.el.classList.remove("bs-dash"); if (s.ev.hit) { s.foe.classList.add("bs-shake"); setTimeout(() => s.foe.classList.remove("bs-shake"), 350); } setTimeout(next, 450); }, 350);
      }
      next();
      setTimeout(finish, 6000); // 安全弁
    });
  }
  global.BattleView = { playSimplified, playScene };
})(window);

</script>
<script>
"use strict";
/* あおびー大戦 エンジン: 移動・戦闘計算・予測・敵AI・勝敗・育成・セーブ
   ブラウザでは window.SRPGEngine、Nodeでは module.exports として動く。 */
(function (global) {
  const TERRAIN = {
    ".": { name: "平地", cost: 1, evade: 0, def: 1.0 },
    P: { name: "参道", cost: 1, evade: 0, def: 1.0 },
    G: { name: "歯車フロア", cost: 1, evade: 0, def: 1.0 },
    F: { name: "森", cost: 2, evade: 15, def: 1.0 },
    V: { name: "村・建物", cost: 1, evade: 10, def: 1.0, heal: true },
    R: { name: "川", cost: 3, evade: 0, def: 1.0 },
    W: { name: "水上", cost: 3, evade: 0, def: 1.0 },
    L: { name: "灯り", cost: 1, evade: 5, def: 1.0, lamp: true },
    X: { name: "障害物", cost: Infinity, evade: 0, def: 1.0 }
  };
  function terrainAt(stage, x, y) {
    if (x < 0 || y < 0 || y >= stage.terrain.length || x >= stage.terrain[0].length) return TERRAIN.X;
    return TERRAIN[stage.terrain[y][x]] || TERRAIN["."];
  }
  function terrainChar(stage, x, y) { return stage.terrain[y][x]; }
  function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function createRun(data) {
    const run = { funds: 0, cleared: 0, pilots: {}, mods: {}, parts: {}, hoshiLearned: {} };
    for (const pid of Object.keys(data.pilots.pilots)) {
      run.pilots[pid] = { level: 1, exp: 0, kills: 0, hp: 0, atk: 0, aim: 0, eva: 0 };
      run.hoshiLearned[pid] = data.pilots.pilots[pid].hoshi.slice();
    }
    for (const uid of Object.keys(data.units.units)) {
      run.mods[uid] = { kaizou: 0 };              // インターミッション後付け用: 改造段階（全0）
      run.parts[uid] = [null, null];              // 強化パーツ枠（2枠・空）
    }
    return run;
  }

  let uidSeq = 1;
  function allyUnit(data, run, spec) {
    const p = data.pilots.pilots[spec.pilot], u = data.units.units[p.unit], g = run.pilots[spec.pilot];
    return {
      uid: uidSeq++, side: "ally", pilotId: spec.pilot, unitId: p.unit,
      name: p.name, unitName: u.name, color: p.color, x: spec.x, y: spec.y,
      maxHp: u.hp + g.hp, hp: u.hp + g.hp, maxEn: u.en, en: u.en,
      move: u.move, armor: u.armor, aim: p.aim + g.aim, eva: p.eva + g.eva, atk: p.atk + g.atk,
      weapons: u.weapons, maxSp: p.sp, sp: p.sp, morale: 100, level: g.level,
      acted: false, boss: false, flags: {}
    };
  }
  function enemyUnit(data, spec, stageId) {
    const u = data.units.units[spec.unit];
    const lv = stageId; // 敵の強さは面番号に連動
    return {
      uid: uidSeq++, side: "enemy", pilotId: null, unitId: spec.unit,
      name: u.name, unitName: u.name, color: u.color, x: spec.x, y: spec.y,
      maxHp: u.hp + (lv - 1) * 120, hp: u.hp + (lv - 1) * 120, maxEn: u.en, en: u.en,
      move: u.move, armor: u.armor + (lv - 1) * 20, aim: (u.aim || 95) + (lv - 1) * 2, eva: (u.eva || 90), atk: 100 + (lv - 1) * 6,
      weapons: u.weapons, maxSp: 0, sp: 0, morale: 100, level: lv,
      acted: false, boss: !!spec.boss, flags: {}
    };
  }
  function startStage(data, run, stageIdx) {
    const stage = data.stages.stages[stageIdx];
    const st = {
      data, run, stage, stageIdx, turn: 1, phase: "player", result: null,
      units: [], log: [], pendingDialog: null, rustStorm: false, bossHalfShown: false, medal: false
    };
    for (const a of stage.allies) st.units.push(allyUnit(data, run, a));
    for (const e of stage.enemies) st.units.push(enemyUnit(data, e, stage.id));
    for (const n of stage.npcs || []) {
      const u = data.units.units[n.unit];
      st.units.push({ uid: uidSeq++, side: "npc", pilotId: null, unitId: n.unit, name: u.name, unitName: u.name, color: u.color, x: n.x, y: n.y, maxHp: u.hp, hp: u.hp, maxEn: 0, en: 0, move: u.move, armor: u.armor, aim: 0, eva: u.eva, atk: 0, weapons: [], maxSp: 0, sp: 0, morale: 100, level: 1, acted: false, boss: false, flags: {} });
    }
    return st;
  }
  function unitAt(st, x, y) { return st.units.find(u => u.hp > 0 && u.x === x && u.y === y) || null; }
  function living(st, side) { return st.units.filter(u => u.hp > 0 && u.side === side); }

  function computeMoveRange(st, unit) {
    const maxCost = unit.move + (unit.flags.kasoku || 0);
    const key = (x, y) => x + "," + y;
    const cost = new Map([[key(unit.x, unit.y), 0]]);
    const q = [{ x: unit.x, y: unit.y, c: 0 }];
    while (q.length) {

<script>
"use strict";
/* あおびー大戦 序盤縦切り: 画面遷移と入力の glue */
const E = window.SRPGEngine;
let DATA = null, run = null, st = null, stageIdx = 0;
let sel = null; // {unit, mode, preMove, weaponIdx, hoshiCmd}
let busy = false;
const settings = { anim: localStorage.getItem("aobee-taisen-anim") !== "off" };
const $ = id => document.getElementById(id);
const panel = new Panel($("panel"));
const grid = new GridMap($("grid"), onTapCell);

async function boot() {
  const pilots = window.__EMBED_DATA.pilots, units = window.__EMBED_DATA.units, stages = window.__EMBED_DATA.stages;
  DATA = { pilots, units, stages };
  refreshTitle();
}
function refreshTitle() {
  const saved = E.loadRun(localStorage, DATA);
  $("btn-continue").disabled = !saved;
  $("btn-anim").textContent = "戦闘アニメ（横画面）: " + (settings.anim ? "ON" : "OFF");
  const ss = $("stage-select");
  if (saved && saved.cleared > 0) {
    ss.classList.remove("hidden"); ss.innerHTML = "";
    const label = document.createElement("div");
    label.style.cssText = "color:#94a3b8;font-size:12px;margin-top:6px";
    label.textContent = "面を選んで始める（育成は引き継ぎます）";
    ss.appendChild(label);
    for (let i = 0; i <= Math.min(saved.cleared, DATA.stages.stages.length - 1); i++) {
      const b = document.createElement("button"); b.className = "sub";
      b.textContent = "第" + (i + 1) + "面 " + DATA.stages.stages[i].title;
      b.style.marginTop = "6px";
      b.addEventListener("click", () => { run = saved; startStage(i); });
      ss.appendChild(b);
    }
  } else ss.classList.add("hidden");
}
$("btn-new").addEventListener("click", () => { run = E.createRun(DATA); startStage(0); });
$("btn-continue").addEventListener("click", () => {
  const saved = E.loadRun(localStorage, DATA);
  if (saved) { run = saved; startStage(Math.min(saved.cleared, DATA.stages.stages.length - 1)); }
});
$("btn-anim").addEventListener("click", () => {
  settings.anim = !settings.anim;
  localStorage.setItem("aobee-taisen-anim", settings.anim ? "on" : "off");
  refreshTitle();
});
$("btn-title").addEventListener("click", () => {
  if (run) E.saveRun(localStorage, run);
  $("app").classList.add("hidden"); $("title-screen").classList.remove("hidden"); refreshTitle();
});
$("btn-phase").addEventListener("click", () => { if (!busy && st && !st.result) enemyTurn(); });

function isLandscape() { return window.innerWidth > window.innerHeight; }
function setOrientation() { document.body.classList.toggle("landscape", isLandscape()); }
window.addEventListener("resize", setOrientation);

async function startStage(idx) {
  stageIdx = idx; sel = null;
  st = E.startStage(DATA, run, idx);
  $("title-screen").classList.add("hidden"); $("app").classList.remove("hidden");
  setOrientation();
  E.saveRun(localStorage, run);
  render();
  if (st.stage.intro) await showDialog(st.stage.intro);
  render();
}
function objectiveText() {
  let t = st.stage.winType === "boss" ? "目的: ボスの撃破" : "目的: 敵の全滅";
  if (st.stage.loseNpc) t += "／動物を守る";
  if (st.stage.turnLimit) t += "／" + st.stage.turnLimit + "ターン以内";
  if (st.stage.fog) t += "／霧: 灯りの近く以外は命中-30";
  if (st.rustStorm) t += "／錆嵐: 敵攻撃+10%";
  return t;
}
function render() {
  if (!st) return;
  $("hd-stage").textContent = "第" + st.stage.id + "面 " + st.stage.title;
  $("hd-turn").textContent = "TURN " + st.turn;
  $("hd-obj").textContent = objectiveText();
  $("hd-funds").textContent = "歯車コイン " + run.funds;
  let moveTiles = [], attackTiles = [];
  if (sel && sel.mode === "select") moveTiles = E.computeMoveRange(st, sel.unit);
  if (sel && sel.mode === "target") attackTiles = targetTiles();
  if (sel && sel.mode === "healTarget") attackTiles = healTargetTiles();
  if (sel && sel.mode === "hoshiTarget") attackTiles = E.living(st, "ally").map(u => ({ x: u.x, y: u.y }));
  grid.setHighlights(moveTiles, attackTiles);
  grid.render(st);
  renderPanel();
}
function targetTiles() {
  const u = sel.unit, w = u.weapons[sel.weaponIdx];
  return E.living(st, "enemy").filter(e => { const d = E.dist(u, e); return d >= w.min && d <= w.max; }).map(e => ({ x: e.x, y: e.y }));
}
function healWeapons(u) { return u.weapons.map((w, i) => ({ w, i })).filter(x => x.w.heal); }
function healTargetTiles() {
  const u = sel.unit, w = u.weapons[sel.weaponIdx];
  return E.living(st, "ally").filter(a => { const d = E.dist(u, a); return d >= w.min && d <= w.max; }).map(a => ({ x: a.x, y: a.y }));
}
function attackWeaponsVsAny(u) {
  return u.weapons.map((w, i) => ({ w, i })).filter(x => !x.w.heal && u.en >= (x.w.en || 0) && u.morale >= (x.w.morale || 0) &&
    E.living(st, "enemy").some(e => { const d = E.dist(u, e); return d >= x.w.min && d <= x.w.max; }));
}
function renderPanel() {
  if (st.result) return renderResultPanel();
  if (!sel) {
    panel.show("<h3>味方フェイズ (TURN " + st.turn + ")</h3><div class='stat'>味方ユニットをタップして選択。移動→武器→予測→攻撃の順に進みます。ほしコマンドはSPを消費します。</div>");
    return;
  }
  const u = sel.unit;
  let html = panel.unitCard(u);
  if (sel.mode === "select") {
    html += "<div class='stat'>青いマスをタップで移動。その場に留まる場合は自分のマスをタップ。</div>";
    panel.show(html);
    addHoshiButtons(u, "select");
    panel.buttons([{ label: "待機する", onClick: () => endUnitAction() }]);
  } else if (sel.mode === "moved") {
    panel.show(html + "<div class='stat'>コマンドを選んでください。</div>");
    const items = [];
    if (attackWeaponsVsAny(u).length) items.push({ label: "攻撃", cls: "primary", onClick: () => { sel.mode = "weapon"; render(); } });
    if (healWeapons(u).length && healTargetTilesFor(u).length) items.push({ label: "回復・修理", onClick: () => { sel.mode = "healWeapon"; render(); } });
    items.push({ label: "移動をキャンセル", onClick: cancelMove });
    items.push({ label: "待機する", onClick: () => endUnitAction() });
    panel.buttons(items);
    addHoshiButtons(u, "moved");
  } else if (sel.mode === "weapon") {
    panel.show(html + "<div class='stat'>武器を選んでください。</div>");
    panel.buttons(attackWeaponsVsAny(u).map(x => ({
      label: x.w.name + " (威力" + x.w.power + " 命中" + x.w.hit + " 射程" + x.w.min + "-" + x.w.max + (x.w.en ? " EN" + x.w.en : "") + ")",
      onClick: () => { sel.weaponIdx = x.i; sel.mode = "target"; render(); }
    })).concat([{ label: "もどる", onClick: () => { sel.mode = "moved"; render(); } }]));
  } else if (sel.mode === "target") {
    panel.show(html + "<div class='stat'>赤いマスの敵をタップすると戦闘予測が出ます。</div>");
    panel.buttons([{ label: "もどる", onClick: () => { sel.mode = "weapon"; render(); } }]);
  } else if (sel.mode === "forecast") {
    const f = sel.forecast, d = sel.target;
    let tbl = "<h3>戦闘予測</h3><table><tr><th></th><th>" + u.name + "</th><th>" + d.name + "</th></tr>" +
      "<tr><td>武器</td><td>" + f.weapon.name + "</td><td>" + (f.counter ? f.counter.weapon.name : "―") + "</td></tr>" +
      "<tr><td>ダメージ</td><td>" + f.dmg + "</td><td>" + (f.counter ? f.counter.dmg : "―") + "</td></tr>" +
      "<tr><td>命中</td><td>" + f.hit + "%</td><td>" + (f.counter ? f.counter.hit + "%" : "―") + "</td></tr></table>" +
      "<div class='stat'>敵の対応: " + ({ counter: "反撃", defend: "防御（ダメージ半減）", evade: "回避（命中-30）" })[f.stance] + " ／ 撃墜で歯車コイン+" + Math.round(d.maxHp / 8) + "</div>";
    panel.show(tbl);
    panel.buttons([
      { label: "たたかう", cls: "primary", onClick: doPlayerAttack },
      { label: "もどる", onClick: () => { sel.mode = "target"; render(); } }
    ]);
  } else if (sel.mode === "healWeapon") {
    panel.show(html + "<div class='stat'>回復・修理の方法を選んでください。</div>");
    panel.buttons(healWeapons(u).map(x => ({
      label: x.w.name + " (回復" + x.w.power + " 射程" + x.w.min + "-" + x.w.max + ")",
      onClick: () => { sel.weaponIdx = x.i; sel.mode = "healTarget"; render(); }
    })).concat([{ label: "もどる", onClick: () => { sel.mode = "moved"; render(); } }]));
  } else if (sel.mode === "healTarget") {
    panel.show(html + "<div class='stat'>赤いマスの味方をタップで回復・修理します。</div>");
    panel.buttons([{ label: "もどる", onClick: () => { sel.mode = "healWeapon"; render(); } }]);
  } else if (sel.mode === "hoshiTarget") {
    panel.show(html + "<div class='stat'>対象の味方をタップしてください。</div>");
    panel.buttons([{ label: "やめる", onClick: () => { sel.mode = sel.prevMode; render(); } }]);
  }
}
function healTargetTilesFor(u) {
  return healWeapons(u).flatMap(x => {
    const w = x.w;
    return E.living(st, "ally").filter(a => { const d = E.dist(u, a); return d >= w.min && d <= w.max; });
  });
}
function addHoshiButtons(u, mode) {
  const cmds = (run.hoshiLearned[u.pilotId] || []).map(id => ({ id, m: DATA.pilots.hoshiCommands[id] })).filter(x => x.m);
  if (!cmds.length) return;
  panel.buttons(cmds.map(x => ({
    label: "ほし: " + x.m.name + " (SP" + x.m.sp + ") " + x.m.desc,
    disabled: u.sp < x.m.sp,
    onClick: () => {
      if (x.id === "ouen" || x.id === "gekirei") { sel.hoshiCmd = x.id; sel.prevMode = mode; sel.mode = "hoshiTarget"; render(); }
      else { E.applyHoshi(st, u, x.id, u); render(); }
    }
  })));
}
function onTapCell(x, y) {
  if (busy || !st || st.result || st.phase !== "player") return;
  const tapped = E.unitAt(st, x, y);
  if (!sel) {
    if (tapped && tapped.side === "ally" && !tapped.acted) {
      sel = { unit: tapped, mode: "select", preMove: { x: tapped.x, y: tapped.y } };
      render();
    } else if (tapped) {
      panel.show(panel.unitCard(tapped) + "<div class='stat'>" + (tapped.side === "enemy" ? "敵ユニット" : tapped.side === "npc" ? "守る対象" : "行動済み") + "</div>");
    }
    return;
  }
  const u = sel.unit;
  if (sel.mode === "select") {
    const tiles = E.computeMoveRange(st, u);
    if (tiles.some(t => t.x === x && t.y === y)) {
      u.x = x; u.y = y; sel.mode = "moved"; render();
    } else if (tapped && tapped.side === "ally" && tapped !== u && !tapped.acted) {
      sel = { unit: tapped, mode: "select", preMove: { x: tapped.x, y: tapped.y } }; render();
    }
    return;
  }
  if (sel.mode === "target") {
    if (tapped && tapped.side === "enemy" && targetTiles().some(t => t.x === x && t.y === y)) {
      sel.target = tapped; sel.forecast = E.forecast(st, u, tapped, sel.weaponIdx); sel.mode = "forecast"; render();
    }
    return;
  }
  if (sel.mode === "healTarget") {
    if (tapped && tapped.side === "ally" && healTargetTiles().some(t => t.x === x && t.y === y)) doHeal(tapped);
    return;
  }
  if (sel.mode === "hoshiTarget") {
    if (tapped && tapped.side === "ally") {
      E.applyHoshi(st, u, sel.hoshiCmd, tapped);
      sel.mode = sel.prevMode; render();
    }
    return;
  }
}
function cancelMove() {
  sel.unit.x = sel.preMove.x; sel.unit.y = sel.preMove.y;
  sel.mode = "select"; render();
}
function endUnitAction() {
  sel.unit.acted = true; sel = null; render(); checkEnd();
}
async function doPlayerAttack() {
  busy = true;
  const u = sel.unit, d = sel.target;
  const events = E.resolveCombat(st, u, d, sel.weaponIdx, Math.random);
  const useScene = isLandscape() && settings.anim;
  if (useScene) await BattleView.playScene(u, d, events);
  else await BattleView.playSimplified($("grid"), st, events);
  sel = null; u.acted = true; busy = false;
  render();
  await afterAction();
}
async function doHeal(target) {
  busy = true;
  const u = sel.unit;
  const events = E.healAction(st, u, target, sel.weaponIdx, Math.random);
  await BattleView.playSimplified($("grid"), st, events);
  sel = null; u.acted = true; busy = false;
  render();
  await afterAction();
}
async function afterAction() {
  if (st.pendingDialog) { const d = st.pendingDialog; st.pendingDialog = null; await showDialog(d); }
  checkEnd(); render();
}
function checkEnd() { /* 結果は renderResultPanel が st.result を見て表示する */ }
async function enemyTurn() {
  busy = true; sel = null;
  st.phase = "enemy"; render();
  const events = E.enemyPhase(st, Math.random);
  await BattleView.playSimplified($("grid"), st, events);
  if (st.pendingDialog) { const d = st.pendingDialog; st.pendingDialog = null; await showDialog(d); }
  if (!st.result) {
    E.npcPhase(st, Math.random);
    E.startPlayerPhase(st);
    if (st.pendingDialog) { const d = st.pendingDialog; st.pendingDialog = null; render(); await showDialog(d); }
  }
  busy = false;
  render();
  if (st.result) await handleResult();
}
function renderResultPanel() {
  if (st.result === "win") {
    run.cleared = Math.max(run.cleared, stageIdx + 1);
    E.saveRun(localStorage, run);
    panel.show("<h3>面クリア！</h3><div class='stat'>" + st.turn + "ターンでクリア" +
      (st.medal ? " ／ ほし勲章 獲得！" : "（ほし勲章は" + st.stage.medalTurns + "ターン以内）") +
      "<br>歯車コイン: " + run.funds + "</div>");
    const items = [];
    if (stageIdx + 1 < DATA.stages.stages.length) items.push({ label: "次の面へ", cls: "primary", onClick: () => startStage(stageIdx + 1) });
    items.push({ label: "タイトルへ", onClick: () => $("btn-title").click() });
    panel.buttons(items);
    if (!st._clearShown) { st._clearShown = true; if (st.stage.clear) showDialog(st.stage.clear); }
  } else {
    E.saveRun(localStorage, run);
    panel.show("<h3>敗北…</h3><div class='stat'>" + (st.loseReason || "") + "<br>獲得した経験値と歯車コインは引き継がれます。育成して再挑戦できます。</div>");
    panel.buttons([
      { label: "リトライ（育成引継ぎ）", cls: "primary", onClick: () => startStage(stageIdx) },
      { label: "タイトルへ", onClick: () => $("btn-title").click() }
    ]);
  }
}
async function handleResult() { render(); }
boot();

</script>
</body></html>
