<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOBEE CITY v0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#203542;color:white;font:14px system-ui}header,footer{display:flex;flex-wrap:wrap;gap:5px;padding:7px;align-items:center}button,select{background:#38586b;color:white;border:1px solid #829da9;border-radius:5px;padding:9px}button.on{background:#e5b34d;color:#182b36}main{display:flex;height:calc(100dvh - 170px);min-height:180px}canvas{flex:1;width:0;min-width:0;height:100%;touch-action:none}aside{width:130px;padding:8px;background:#294554;overflow:auto}meter{width:100%}@media(max-width:600px){aside{width:100px;font-size:11px}button{padding:6px;font-size:12px}main{height:calc(100dvh - 200px)}}</style><header><b>★ AOBEE CITY v0.7</b><span id="stats"></span><button onclick="speed=0">停止</button><button onclick="speed=1">▶</button><button onclick="speed=4">▶▶</button><button onclick="save()">保存</button><button onclick="load()">読込</button></header><main><canvas id="c"></canvas><aside>都市需要<div id="demand"></div><p id="power"></p><p id="jobs"></p>税率 <select id="tax"><option>5</option><option selected>9</option><option>12</option><option>15</option></select>%<p id="msg"></p><p id="metrics"></p><p id="event"></p><label><input id="disasters" type="checkbox" checked>災害</label><button onclick="consult()">秘書に相談</button><button onclick="borrow()">融資</button><select id="overlay"><option value="">通常</option><option value="traffic">交通</option><option value="pollution">公害</option><option value="happy">幸福</option><option value="water">水道</option></select></aside></main><footer id="tools"></footer><footer><button onclick="zoom(1.25)">拡大＋</button><button onclick="zoom(.8)">縮小－</button><button onclick="ox=0;oy=0">原点</button><span id="info"></span></footer><script>
const N=64,$=id=>document.getElementById(id),C=$('c'),g=C.getContext('2d');let grid=Array.from({length:N*N},(_,i)=>({t:Math.sin(i%N*.22)+Math.cos((i/N|0)*.13)>1.55?'tree':'grass',l:0})),cash=20000,month=0,speed=1,tool='road',s=28,ox=0,oy=0,pop=0,jobs=0,cap=0,need=0,dem=[.7,.5,.7],net=0;const defs={move:['移動',0],road:['道路',20],r:['住宅',40],c:['商業',60],i:['工業',60],plant:['発電所',1200],park:['公園',100],water:['給水塔',700],police:['警察',450],fire:['消防',450],school:['学校',550],hospital:['病院',800],rail:['鉄道',80],station:['駅',600],leisure:['娯楽',500],aquarium:['水族館',1800],museum:['星の神殿記念館',2500],golf:['ゴルフ場',2200],clear:['撤去',10]};for(const [k,v] of Object.entries(defs)){let b=document.createElement('button');b.textContent=v[0]+(v[1]?' $'+v[1]:'');b.onclick=()=>{tool=k;document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('tools').append(b);if(k===tool)b.classList.add('on')}
function neighbors(i){let x=i%N,y=i/N|0;return [x>0?i-1:-1,x<N-1?i+1:-1,y>0?i-N:-1,y<N-1?i+N:-1].filter(x=>x>=0)}
function recalc(){pop=jobs=cap=need=0;let cj=0;for(let a of grid){if(a.t==='r')pop+=a.l*12;if(a.t==='c'){jobs+=a.l*8;cj+=a.l*8}if(a.t==='i')jobs+=a.l*15;if(a.t==='plant')cap+=180;if(['r','c','i'].includes(a.t))need+=a.l*2+1}dem=[Math.max(.08,Math.min(1,(jobs+35-pop*.55)/80)),Math.max(.05,Math.min(1,(pop*.35-cj+20)/70)),Math.max(.08,Math.min(1,(pop*.65-jobs+45)/90))]}
function tick(){recalc();analyze();let powered=new Set(),q=[];grid.forEach((a,i)=>{if(a.t==='plant'){powered.add(i);q.push(i)}});for(let j=0;j<q.length;j++)for(let n of neighbors(q[j]))if(!powered.has(n)&&['road','plant'].includes(grid[n].t)){powered.add(n);q.push(n)}let order=Array.from({length:grid.length},(_,i)=>i);for(let j=order.length-1;j>0;j--){let k=Math.random()*(j+1)|0;[order[j],order[k]]=[order[k],order[j]]}for(let i of order){let a=grid[i],k=['r','c','i'].indexOf(a.t);if(k<0)continue;let ok=neighbors(i).some(n=>grid[n].t==='road'&&powered.has(n));if(ok&&(pop<120||local[i].water>0)&&need+2<=cap&&a.l<3&&Math.random()<dem[k]*.35*(.3+local[i].happy/100)*(1-Number($('tax').value)/25)){a.l++;need+=2}else if((!ok||need>cap||local[i].happy<30||Number($('tax').value)>13)&&a.l&&Math.random()<.13){a.l--;need-=2}}recalc();net=Math.round((pop*1.5+jobs*2)*Number($('tax').value)/9-grid.filter(a=>a.t==='road').length*.5-grid.filter(a=>a.t==='plant').length*45-grid.filter(a=>a.t==='park').length*3);net+=tourism-cost-Math.ceil(debt*.006);if(debt&&cash+net>1000){let p=Math.min(debt,100);debt-=p;net-=p}cash+=net;month++;events();ui()}
function ui(){analyze();$('metrics').textContent='幸福 '+happy+'%｜観光収入 $'+tourism+'｜借入 $'+debt+'｜'+rank();$('event').textContent=eventLog;$('stats').textContent='人口 '+pop+' ｜ $'+Math.floor(cash).toLocaleString()+' ｜ '+(1+(month/12|0))+'年'+(month%12+1)+'月 ｜ 月収 '+net;$('demand').innerHTML=dem.map((v,i)=>['住宅','商業','工業'][i]+'<meter min="0" max="1" value="'+v+'"></meter>').join('');$('power').textContent='電力 '+need+'/'+cap;$('jobs').textContent='雇用 '+jobs;$('msg').textContent=cap===0?'発電所を道路につなごう！':need>=cap?'電力不足！':jobs<pop*.4?'仕事を増やそう！':net<0?'財政が赤字だよ！':'街を育てよう！'}
function draw(){let w=C.clientWidth,h=C.clientHeight;if(C.width!==w||C.height!==h){C.width=w;C.height=h}g.fillStyle='#142b32';g.fillRect(0,0,w,h);for(let y=Math.max(0,Math.floor(-oy/s));y<Math.min(N,(h-oy)/s);y++)for(let x=Math.max(0,Math.floor(-ox/s));x<Math.min(N,(w-ox)/s);x++){let a=grid[y*N+x],X=ox+x*s,Y=oy+y*s;function rect(c,x,y,w,h){g.fillStyle=c;g.fillRect(X+x*s,Y+y*s,w*s,h*s)}rect((x+y)%2?'#80aa60':'#86b267',0,0,1,1);rect('#ffffff18',.12,.15,.08,.05);if(a.t==='tree'||a.t==='park'){rect('#426d36',.13,.2,.7,.7);rect('#79553a',.45,.5,.12,.38);rect('#285e39',.2,.12,.6,.52);rect('#58934b',.23,.12,.4,.3);if(a.t==='park')rect('#d7c39b',0,.83,1,.12)}if(a.t==='road'){rect('#69747b',0,0,1,1);rect('#a8aeb0',0,0,1,.08);for(let n of neighbors(y*N+x).filter(n=>grid[n].t==='road')){let dx=n%N-x,dy=(n/N|0)-y;rect('#e8dcb0',.46+Math.min(0,dx)*.5,.46+Math.min(0,dy)*.5,dx?.58:.08,dy?.58:.08)}}if(['r','c','i'].includes(a.t)){rect({r:'#b5d987',c:'#8abbd9',i:'#e3c16b'}[a.t],.04,.04,.92,.92);if(a.l){let top=.64-a.l*.16;rect('#314a5055',.22,top+.1,.72,.78-top);rect({r:'#f0d5a6',c:'#80b9d8',i:'#c4a27b'}[a.t],.14,top,.68,.83-top);rect('#526b76',.14,top,.68,.12);if(a.t==='r'){g.fillStyle='#ad5548';g.beginPath();g.moveTo(X+.08*s,Y+(top+.1)*s);g.lineTo(X+.48*s,Y+(top-.13)*s);g.lineTo(X+.88*s,Y+(top+.1)*s);g.fill()}for(let j=0;j<a.l;j++){rect('#36566c',.25,.64-j*.14,.14,.1);rect('#f8e9ae',.52,.64-j*.14,.14,.1)}rect('#694f3f',.43,.74,.13,.09);if(a.t==='i'){rect('#805b4b',.7,.05,.12,.45);rect('#d8c6b1',.69,.04,.14,.07)}}}if(service[a.t]){rect('#d5d9cc',.08,.12,.84,.8);rect('#526b76',.08,.12,.84,.18);g.fillStyle='#203542';g.font=Math.max(8,s*.43)+'px sans-serif';g.textAlign='center';g.fillText(service[a.t][0],X+s*.5,Y+s*.72)}if(a.t==='plant'){rect('#c2b8a1',.08,.32,.84,.6);rect('#845b50',.16,.08,.15,.55);rect('#845b50',.68,.02,.15,.6);rect('#e5bc4b',.4,.45,.2,.25)}let mode=$('overlay').value;if(mode&&local[y*N+x]){let v=local[y*N+x][mode];rect(mode==='water'?(v?'#28aaff55':'#ee443355'):'hsla('+((mode==='happy'?v:100-v)*1.2)+',90%,50%,.42)',0,0,1,1)}if(y*N+x===target){g.strokeStyle='#ffe755';g.lineWidth=3;g.strokeRect(X+2,Y+2,s-4,s-4)}}requestAnimationFrame(draw)}
function zoom(f){let old=s;s=Math.max(10,Math.min(64,s*f));ox=C.width/2-(C.width/2-ox)*s/old;oy=C.height/2-(C.height/2-oy)*s/old}let down=false,last=null,prev=null,pointer=null;function place(e){let r=C.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/s),y=Math.floor((e.clientY-r.top-oy)/s);if(x<0||y<0||x>=N||y>=N)return;let i=y*N+x;if(i===prev)return;prev=i;let a=grid[i];if(a.t===tool||cash<defs[tool][1])return;if(unlocks[tool]&&pop<unlocks[tool]){$('info').textContent='人口 '+unlocks[tool]+' 人で解禁';return}if(tool==='clear'&&a.t==='grass')return;if(tool!=='clear'&&!['grass','tree'].includes(a.t))return;cash-=defs[tool][1];grid[i]={t:tool==='clear'?'grass':tool,l:0};recalc();ui()}C.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;C.setPointerCapture(e.pointerId);down=true;last=[e.clientX,e.clientY];prev=null;if(tool!=='move')place(e)};C.onpointermove=e=>{if(!down||pointer!==e.pointerId)return;if(tool==='move'){ox+=e.clientX-last[0];oy+=e.clientY-last[1];last=[e.clientX,e.clientY]}else place(e)};C.onpointerup=C.onpointercancel=e=>{if(pointer===e.pointerId){down=false;pointer=null}};C.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)};function save(){try{localStorage.setItem('aobeeCity01',JSON.stringify({grid,cash,month,tax:$('tax').value,debt,best,eventLog,disasters:$('disasters').checked}));$('info').textContent='保存しました'}catch(e){$('info').textContent='保存失敗'}}function load(){try{let d=JSON.parse(localStorage.getItem('aobeeCity01'));if(!d){$('info').textContent='保存なし';return}if(!Array.isArray(d.grid)||d.grid.length!==N*N||!Number.isFinite(d.cash))throw Error();grid=d.grid;debt=Number(d.debt)||0;best=Number(d.best)||0;eventLog=d.eventLog||'';$('disasters').checked=d.disasters!==false;cash=d.cash;month=d.month;$('tax').value=d.tax;recalc();ui();$('info').textContent='読み込みました'}catch(e){$('info').textContent='読み込み失敗'}}const service={water:['水',18],police:['警',12],fire:['消',12],school:['学',15],hospital:['医',22],rail:['線',2],station:['駅',18],leisure:['遊',14],aquarium:['魚',35],museum:['星',40],golf:['G',32]},unlocks={station:500,rail:500,aquarium:800,golf:1200,museum:2000};let debt=0,best=0,eventLog='',target=-1,local=[],happy=70,tourism=0,cost=0;const ranks=[[0,'集落'],[100,'村'],[500,'町'],[1500,'小都市'],[4000,'中都市'],[10000,'大都市']];function rank(){return ranks.filter(x=>pop>=x[0]).at(-1)[1]}
function analyze(){let n=grid.length,dist=new Int32Array(n).fill(-1),parent=new Int32Array(n).fill(-1),flow=new Float32Array(n),q=[],stations=[],fac=[];cost=0;tourism=0;grid.forEach((a,i)=>{if(service[a.t]){cost+=service[a.t][1];fac.push(i)}if(a.t==='station')stations.push(i);if(['c','i'].includes(a.t)&&a.l)for(let j of neighbors(i))if(grid[j].t==='road'&&dist[j]<0){dist[j]=0;q.push(j)}});for(let k=0;k<q.length;k++)for(let j of neighbors(q[k]))if(grid[j].t==='road'&&dist[j]<0){dist[j]=dist[q[k]]+1;parent[j]=q[k];q.push(j)}let railSeen=new Set(),railQ=[];for(let i of stations)if(neighbors(i).some(j=>grid[j].t==='road')){railSeen.add(i);railQ.push(i)}let activeStations=new Set();for(let i of railQ){let seen=new Set([i]),qq=[i];for(let k=0;k<qq.length;k++)for(let j of neighbors(qq[k]))if(!seen.has(j)&&['rail','station'].includes(grid[j].t)){seen.add(j);qq.push(j)}if(qq.some(j=>j!==i&&railSeen.has(j)))activeStations.add(i)}let distance=(i,j)=>Math.abs(i%N-j%N)+Math.abs((i/N|0)-(j/N|0));grid.forEach((a,i)=>{if(a.t!=='r'||!a.l)return;let j=neighbors(i).filter(j=>dist[j]>=0).sort((a,b)=>dist[a]-dist[b])[0];if(j!==undefined)flow[j]+=a.l*12*([...activeStations].some(k=>distance(i,k)<=5)?.55:1)});for(let k=q.length-1;k>=0;k--){let i=q[k];if(parent[i]>=0)flow[parent[i]]+=flow[i]}local=Array.from({length:n},()=>({water:0,pollution:0,happy:70,traffic:0,services:0}));function spread(i,r,fn){let x=i%N,y=i/N|0;for(let yy=Math.max(0,y-r);yy<=Math.min(N-1,y+r);yy++)for(let xx=Math.max(0,x-r);xx<=Math.min(N-1,x+r);xx++){let d=Math.abs(xx-x)+Math.abs(yy-y);if(d<=r)fn(local[yy*N+xx],d)}}grid.forEach((a,i)=>{if(a.t==='plant'||a.t==='i')spread(i,5,(m,d)=>m.pollution+=(6-d)*(a.t==='plant'?3:2));if(a.t==='park')spread(i,4,(m,d)=>m.pollution-=5-d);if(a.t==='water'&&neighbors(i).some(j=>grid[j].t==='road'))spread(i,10,m=>m.water=1);if(['police','fire','school','hospital','leisure','park'].includes(a.t)&&neighbors(i).some(j=>grid[j].t==='road'))spread(i,7,m=>m.services+=1);if(['aquarium','museum','golf','leisure'].includes(a.t)&&neighbors(i).some(j=>dist[j]>=0))tourism+=Math.round(Math.min(180,pop*.08)*(a.t==='leisure'?.5:1))});let total=0,weight=0;local.forEach((m,i)=>{m.pollution=Math.max(0,Math.min(100,m.pollution));m.traffic=Math.min(100,Math.round(Math.max(flow[i],...neighbors(i).map(j=>flow[j]))/2));m.happy=Math.max(0,Math.min(100,Math.round(76+Math.min(20,m.services*5)-m.pollution*.5-m.traffic*.25-(pop>=120&&!m.water?20:0)-(Number($('tax').value)-9)*3)));if(grid[i].t==='r'&&grid[i].l){total+=m.happy*grid[i].l;weight+=grid[i].l}});happy=weight?Math.round(total/weight):70}
function events(){let n=ranks.filter(x=>pop>=x[0]).length-1;if(n>best){best=n;cash+=n*500;eventLog=rank()+'に発展！ 補助金 $'+n*500}else if(month%12===0&&pop>100){cash+=Math.round(pop*.4);eventLog='星祭り開催！'}else if($('disasters').checked&&pop>100&&Math.random()<.025){let list=grid.map((a,i)=>a.l>0?i:-1).filter(i=>i>=0);if(list.length){let i=list[Math.random()*list.length|0];if(!grid.some((a,j)=>a.t==='fire'&&Math.abs(i%N-j%N)+Math.abs((i/N|0)-(j/N|0))<=7)){grid[i].l--;cash-=120;eventLog='火災発生！'}else eventLog='消防隊が火災を鎮圧！'}}}
function borrow(){if(debt>=20000)return;if(confirm('$5000を借りますか？ 月利0.6%')){debt+=5000;cash+=5000;ui()}}
function consult(){let k=!cap||need>cap*.8?'plant':!grid.some(a=>a.t==='road')?'road':pop>=100&&!grid.some(a=>a.t==='water')?'water':jobs<pop*.5?'i':dem[0]>.5?'r':'c';let i=grid.findIndex((a,i)=>['grass','tree'].includes(a.t)&&neighbors(i).some(j=>grid[j].t==='road'));if(i<0)i=grid.findIndex((a,i)=>['grass','tree'].includes(a.t)&&i%N===4&&(i/N|0)===4);if(confirm(defs[k][0]+'を検討しましょう。費用 $'+defs[k][1]+'。候補地を表示しますか？')&&i>=0){target=i;ox=C.width/2-(i%N+.5)*s;oy=C.height/2-((i/N|0)+.5)*s;document.querySelectorAll('#tools button')[Object.keys(defs).indexOf(k)].click();speed=0}}
let counter=0;setInterval(()=>{if(down||!speed)return;counter+=speed;if(counter>=4){counter=0;tick()}},500);recalc();ui();draw();</script></html>
