function toggleMusic(b){musicOn=!musicOn;b.textContent='♪ BGM：'+(musicOn?'ON':'OFF');if(!musicOn){clearInterval(musicTimer);return}try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let n=0;const notes=[60,64,67,71,69,67,64,62,57,60,64,67,65,64,62,59];function beat(){let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=440*2**((notes[n++%notes.length]-69)/12);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.035,t+.04);v.gain.exponentialRampToValueAtTime(.0001,t+.48);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.5)}beat();musicTimer=setInterval(beat,540)}catch(e){musicOn=false;b.textContent='♪ BGM：OFF'}}

function titleDraw(){if(!titleOpen)return;let c=$('skyline'),p=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;if(c.width!==w||c.height!==h){c.width=w;c.height=h}let t=Date.now()/1000,sky=p.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#18375e');sky.addColorStop(.55,'#e7a27e');sky.addColorStop(1,'#f4d59a');p.fillStyle=sky;p.fillRect(0,0,w,h);let u=Math.min(w/22,h/13),cx=w*.68,cy=h*.18;function pt(x,y,z=0){return [cx+(x-y)*u*.5,cy+(x+y)*u*.25-z*u]}function poly(color,pts){p.fillStyle=color;p.beginPath();pts.forEach((a,i)=>i?p.lineTo(...a):p.moveTo(...a));p.closePath();p.fill()}function tile(x,y,z,color){poly(color,[pt(x,y,z),pt(x+1,y,z),pt(x+1,y+1,z),pt(x,y+1,z)])}function block(x,y,z,a,b,d,roof,left,right){poly(left,[pt(x,y+b,z),pt(x+a,y+b,z),pt(x+a,y+b,z+d),pt(x,y+b,z+d)]);poly(right,[pt(x+a,y,z),pt(x+a,y+b,z),pt(x+a,y+b,z+d),pt(x+a,y,z+d)]);poly(roof,[pt(x,y,z+d),pt(x+a,y,z+d),pt(x+a,y+b,z+d),pt(x,y+b,z+d)])}p.fillStyle='#ffe7ac';p.beginPath();p.arc(w*.82,h*.15,u*.9,0,Math.PI*2);p.fill();for(let i=0;i<5;i++){let x=(i*173+t*2)%(w+180)-90,y=h*(.08+i*.035);p.fillStyle='#fff1d766';p.beginPath();p.ellipse(x,y,70,12,0,0,Math.PI*2);p.fill()}for(let y=0;y<20;y++)for(let x=0;x<20;x++){let road=x%5===0||y%5===0,river=x===15||x===16;tile(x,y,0,river?'#559ab4':road?'#697d82':(x+y)%2?'#86ae76':'#91b77e');if(road&&!river){let a=pt(x+.5,y+.5,.01);p.fillStyle='#e8d4a4';p.fillRect(a[0]-2,a[1]-1,4,2)}}for(let k=0;k<39;k++)for(let x=0;x<20;x++){let y=k-x;if(y<0||y>=20||x===15||x===16||x%5===0||y%5===0)continue;let n=(x*71+y*37)%19;if(n<3){block(x+.35,y+.35,0,.12,.12,.25,'#a47c52','#765b43','#654e3a');block(x+.16,y+.16,.22,.55,.55,.35,'#8dc17b','#4b855c','#366c54');continue}let d=(x>5&&x<14&&y<12)? .5+n*.105:.35+n*.025;let colors=n%3===0?['#d8e7e2','#91b8c2','#6e93ac']:n%3===1?['#f6d5a4','#d3ad88','#ad8879']:['#b8d4dc','#81a5ba','#5c7f9a'];block(x+.1,y+.1,0,.78,.78,d,...colors);for(let z=.18;z<d-.06;z+=.22)for(let j=0;j<3;j++){let a=pt(x+.22+j*.22,y+.881,z);p.fillStyle=(j+n)%3?'#ffe3a0':'#4c7185';p.fillRect(a[0],a[1],u*.085,u*.075)}if(d<.8)block(x+.07,y+.07,d,.84,.84,.08,'#ad6657','#a3594e','#844c48');else block(x+.36,y+.36,d,.25,.25,.16,'#e4e5d4','#aabbb9','#8a9fa8')}for(let i=0;i<12;i++){let x=(t*.6+i*3.7)%20,y=(i%4)*5+.5;if(x>=15&&x<17)continue;block(x,y,.03,.28,.16,.1,i%2?'#f5c45d':'#e5eff0','#b46e55','#8c8c83')}requestAnimationFrame(titleDraw)}
