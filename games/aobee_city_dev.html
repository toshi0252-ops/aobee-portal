<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOBEE CITY v0.2</title><style>*{box-sizing:border-box}body{margin:0;background:#203542;color:white;font:14px system-ui}header,footer{display:flex;flex-wrap:wrap;gap:5px;padding:7px;align-items:center}button,select{background:#38586b;color:white;border:1px solid #829da9;border-radius:5px;padding:9px}button.on{background:#e5b34d;color:#182b36}main{display:flex;height:calc(100dvh - 170px);min-height:180px}canvas{flex:1;width:0;min-width:0;height:100%;touch-action:none}aside{width:130px;padding:8px;background:#294554;overflow:auto}meter{width:100%}@media(max-width:600px){aside{width:100px;font-size:11px}button{padding:6px;font-size:12px}main{height:calc(100dvh - 200px)}}</style><header><b>★ AOBEE CITY v0.2</b><span id="stats"></span><button onclick="speed=0">停止</button><button onclick="speed=1">▶</button><button onclick="speed=4">▶▶</button><button onclick="save()">保存</button><button onclick="load()">読込</button></header><main><canvas id="c"></canvas><aside>都市需要<div id="demand"></div><p id="power"></p><p id="jobs"></p>税率 <select id="tax"><option>5</option><option selected>9</option><option>12</option><option>15</option></select>%<p id="msg"></p></aside></main><footer id="tools"></footer><footer><button onclick="zoom(1.25)">拡大＋</button><button onclick="zoom(.8)">縮小－</button><button onclick="ox=0;oy=0">原点</button><span id="info"></span></footer><script>
const N=64,$=id=>document.getElementById(id),C=$('c'),g=C.getContext('2d');let grid=Array.from({length:N*N},(_,i)=>({t:Math.sin(i%N*.22)+Math.cos((i/N|0)*.13)>1.55?'tree':'grass',l:0})),cash=20000,month=0,speed=1,tool='road',s=28,ox=0,oy=0,pop=0,jobs=0,cap=0,need=0,dem=[.7,.5,.7],net=0;const defs={move:['移動',0],road:['道路',20],r:['住宅',40],c:['商業',60],i:['工業',60],plant:['発電所',1200],park:['公園',100],clear:['撤去',10]};for(const [k,v] of Object.entries(defs)){let b=document.createElement('button');b.textContent=v[0]+(v[1]?' $'+v[1]:'');b.onclick=()=>{tool=k;document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('tools').append(b);if(k===tool)b.classList.add('on')}
function neighbors(i){let x=i%N,y=i/N|0;return [x>0?i-1:-1,x<N-1?i+1:-1,y>0?i-N:-1,y<N-1?i+N:-1].filter(x=>x>=0)}
function recalc(){pop=jobs=cap=need=0;let cj=0;for(let a of grid){if(a.t==='r')pop+=a.l*12;if(a.t==='c'){jobs+=a.l*8;cj+=a.l*8}if(a.t==='i')jobs+=a.l*15;if(a.t==='plant')cap+=180;if(['r','c','i'].includes(a.t))need+=a.l*2+1}dem=[Math.max(.08,Math.min(1,(jobs+35-pop*.55)/80)),Math.max(.05,Math.min(1,(pop*.35-cj+20)/70)),Math.max(.08,Math.min(1,(pop*.65-jobs+45)/90))]}
function tick(){recalc();let powered=new Set(),q=[];grid.forEach((a,i)=>{if(a.t==='plant'){powered.add(i);q.push(i)}});for(let j=0;j<q.length;j++)for(let n of neighbors(q[j]))if(!powered.has(n)&&['road','plant'].includes(grid[n].t)){powered.add(n);q.push(n)}let order=Array.from({length:grid.length},(_,i)=>i);for(let j=order.length-1;j>0;j--){let k=Math.random()*(j+1)|0;[order[j],order[k]]=[order[k],order[j]]}for(let i of order){let a=grid[i],k=['r','c','i'].indexOf(a.t);if(k<0)continue;let ok=neighbors(i).some(n=>grid[n].t==='road'&&powered.has(n));if(ok&&need+2<=cap&&a.l<3&&Math.random()<dem[k]*.35*(1-Number($('tax').value)/25)){a.l++;need+=2}else if((!ok||need>cap||Number($('tax').value)>13)&&a.l&&Math.random()<.13){a.l--;need-=2}}recalc();net=Math.round((pop*1.5+jobs*2)*Number($('tax').value)/9-grid.filter(a=>a.t==='road').length*.5-grid.filter(a=>a.t==='plant').length*45-grid.filter(a=>a.t==='park').length*3);cash+=net;month++;ui()}
function ui(){$('stats').textContent='人口 '+pop+' ｜ $'+Math.floor(cash).toLocaleString()+' ｜ '+(1+(month/12|0))+'年'+(month%12+1)+'月 ｜ 月収 '+net;$('demand').innerHTML=dem.map((v,i)=>['住宅','商業','工業'][i]+'<meter min="0" max="1" value="'+v+'"></meter>').join('');$('power').textContent='電力 '+need+'/'+cap;$('jobs').textContent='雇用 '+jobs;$('msg').textContent=cap===0?'発電所を道路につなごう！':need>=cap?'電力不足！':jobs<pop*.4?'仕事を増やそう！':net<0?'財政が赤字だよ！':'街を育てよう！'}
function draw(){let w=C.clientWidth,h=C.clientHeight;if(C.width!==w||C.height!==h){C.width=w;C.height=h}g.fillStyle='#142b32';g.fillRect(0,0,w,h);for(let y=Math.max(0,Math.floor(-oy/s));y<Math.min(N,(h-oy)/s);y++)for(let x=Math.max(0,Math.floor(-ox/s));x<Math.min(N,(w-ox)/s);x++){let a=grid[y*N+x],X=ox+x*s,Y=oy+y*s;function rect(c,x,y,w,h){g.fillStyle=c;g.fillRect(X+x*s,Y+y*s,w*s,h*s)}rect((x+y)%2?'#80aa60':'#86b267',0,0,1,1);rect('#ffffff18',.12,.15,.08,.05);if(a.t==='tree'||a.t==='park'){rect('#426d36',.13,.2,.7,.7);rect('#79553a',.45,.5,.12,.38);rect('#285e39',.2,.12,.6,.52);rect('#58934b',.23,.12,.4,.3);if(a.t==='park')rect('#d7c39b',0,.83,1,.12)}if(a.t==='road'){rect('#69747b',0,0,1,1);rect('#a8aeb0',0,0,1,.08);for(let n of neighbors(y*N+x).filter(n=>grid[n].t==='road')){let dx=n%N-x,dy=(n/N|0)-y;rect('#e8dcb0',.46+Math.min(0,dx)*.5,.46+Math.min(0,dy)*.5,dx?.58:.08,dy?.58:.08)}}if(['r','c','i'].includes(a.t)){rect({r:'#b5d987',c:'#8abbd9',i:'#e3c16b'}[a.t],.04,.04,.92,.92);if(a.l){let top=.64-a.l*.16;rect('#314a5055',.22,top+.1,.72,.78-top);rect({r:'#f0d5a6',c:'#80b9d8',i:'#c4a27b'}[a.t],.14,top,.68,.83-top);rect('#526b76',.14,top,.68,.12);if(a.t==='r'){g.fillStyle='#ad5548';g.beginPath();g.moveTo(X+.08*s,Y+(top+.1)*s);g.lineTo(X+.48*s,Y+(top-.13)*s);g.lineTo(X+.88*s,Y+(top+.1)*s);g.fill()}for(let j=0;j<a.l;j++){rect('#36566c',.25,.64-j*.14,.14,.1);rect('#f8e9ae',.52,.64-j*.14,.14,.1)}rect('#694f3f',.43,.74,.13,.09);if(a.t==='i'){rect('#805b4b',.7,.05,.12,.45);rect('#d8c6b1',.69,.04,.14,.07)}}}if(a.t==='plant'){rect('#c2b8a1',.08,.32,.84,.6);rect('#845b50',.16,.08,.15,.55);rect('#845b50',.68,.02,.15,.6);rect('#e5bc4b',.4,.45,.2,.25)}}requestAnimationFrame(draw)}
function zoom(f){let old=s;s=Math.max(10,Math.min(64,s*f));ox=C.width/2-(C.width/2-ox)*s/old;oy=C.height/2-(C.height/2-oy)*s/old}let down=false,last=null,prev=null,pointer=null;function place(e){let r=C.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/s),y=Math.floor((e.clientY-r.top-oy)/s);if(x<0||y<0||x>=N||y>=N)return;let i=y*N+x;if(i===prev)return;prev=i;let a=grid[i];if(a.t===tool||cash<defs[tool][1])return;if(tool==='clear'&&a.t==='grass')return;if(tool!=='clear'&&!['grass','tree'].includes(a.t))return;cash-=defs[tool][1];grid[i]={t:tool==='clear'?'grass':tool,l:0};recalc();ui()}C.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;C.setPointerCapture(e.pointerId);down=true;last=[e.clientX,e.clientY];prev=null;if(tool!=='move')place(e)};C.onpointermove=e=>{if(!down||pointer!==e.pointerId)return;if(tool==='move'){ox+=e.clientX-last[0];oy+=e.clientY-last[1];last=[e.clientX,e.clientY]}else place(e)};C.onpointerup=C.onpointercancel=e=>{if(pointer===e.pointerId){down=false;pointer=null}};C.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)};function save(){try{localStorage.setItem('aobeeCity01',JSON.stringify({grid,cash,month,tax:$('tax').value}));$('info').textContent='保存しました'}catch(e){$('info').textContent='保存失敗'}}function load(){try{let d=JSON.parse(localStorage.getItem('aobeeCity01'));if(!d){$('info').textContent='保存なし';return}if(!Array.isArray(d.grid)||d.grid.length!==N*N||!Number.isFinite(d.cash))throw Error();grid=d.grid;cash=d.cash;month=d.month;$('tax').value=d.tax;recalc();ui();$('info').textContent='読み込みました'}catch(e){$('info').textContent='読み込み失敗'}}let counter=0;setInterval(()=>{if(down||!speed)return;counter+=speed;if(counter>=4){counter=0;tick()}},500);recalc();ui();draw();</script></html>
